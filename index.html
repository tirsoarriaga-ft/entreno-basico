function calcE1RM(kg,reps){if(!reps||reps<=0)return kg;return Math.round(kg*(1+reps/30)*10)/10;}

function getWkForNum(user,num){
  const startId=localStorage.getItem(`bas_${user}_startdate`)||new Date().toISOString().split('T')[0];
  const startMon=new Date(startId+'T12:00:00');
  const day=startMon.getDay();
  const diffToMon=day===0?-6:1-day;
  startMon.setDate(startMon.getDate()+diffToMon);
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label};
}

function LineChart({data,color,h:ht=120,labels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:10,b:24,l:32,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-5,textAnchor:'middle',fontSize:'9',fill:'#aaa'},l):null),
    h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mn.toFixed(1)),
    h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mx.toFixed(1))
  );
}

const HIIT_SENS={
  'RST':'Muy alta, manteniendo calidad de sprint',
  'SIT':'Muy alta con dolor muscular acumulado',

function Hiit({cfg,hiitData,setHiitData,setSaved}){
  const sess=cfg?.hiit||[];
  const [activeS,setActiveS]=useState(sess[0]?.id||'A');
  const [editField,setEditField]=useState(null);
  const [editVal,setEditVal]=useState('');
  if(!sess.length)return h('div',{style:{...card,textAlign:'center',padding:'32px'}},h('div',{style:{fontSize:'32px',marginBottom:'8px'}},'🏃'),h('div',{style:{fontSize:'14px',color:'#999'}},'Sin protocolo HIIT asignado'));
  const curS=sess.find(s=>s.id===activeS)||sess[0];
  const getSessVal=(sessId,field)=>hiitData?.hiitKg?.[sessId]?.[field]||'';
  const setSessVal=(sessId,field,val)=>{setHiitData(prev=>{const n={...prev,hiitKg:{...prev.hiitKg,[sessId]:{...(prev.hiitKg?.[sessId]||{}),[field]:val}}};return n;});setSaved(false);};
  const getReg=(sessId,field)=>hiitData?.regs?.[sessId]?.[field]||'';
  const setReg=(sessId,field,val)=>{setHiitData(prev=>{const n={...prev,regs:{...prev.regs,[sessId]:{...(prev.regs?.[sessId]||{}),[field]:val}}};return n;});setSaved(false);};
  const sensEsp=HIIT_SENS[curS.nom]||'—';
  const detalle=getSessVal(curS.id,'detalle')||curS.detalle;
  const ritmo=getSessVal(curS.id,'ritmo')||curS.ritmo;
  return h('div',null,
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'8px'}},'Sesión HIIT'),
      h('div',{style:{display:'flex',gap:'6px'}},sess.map(s=>h('button',{key:s.id,onClick:()=>setActiveS(s.id),style:{flex:1,padding:'10px 4px',fontSize:'13px',cursor:'pointer',border:'2px solid',borderRadius:'8px',fontWeight:activeS===s.id?'800':'400',color:activeS===s.id?'#111':'#999',background:activeS===s.id?'#F0F0F0':'#fff',borderColor:activeS===s.id?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.08)'}},s.id,' ',h('span',{style:{fontSize:'10px',display:'block',marginTop:'2px',color:'#999'}},s.nom))))
    ),
    h('div',{style:card},
      h('div',{style:{fontSize:'15px',fontWeight:'800',marginBottom:'4px'}},curS.nom),
      h('div',{style:{fontSize:'12px',color:'#999',marginBottom:'12px'}},'Sensación esperada: ',h('span',{style:{color:B,fontWeight:'600'}},sensEsp)),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}},
        [{f:'detalle',l:'📍 Protocolo',v:detalle},{f:'ritmo',l:'⏱ Ritmo / Intensidad',v:ritmo}].map(({f,l,v})=>{
          const editing=editField?.sessId===curS.id&&editField?.field===f;
          return h('div',{key:f},
            h('div',{style:lbl},l),
            editing
              ?h('input',{type:'text',value:editVal,onChange:e=>setEditVal(e.target.value),onBlur:()=>{setSessVal(curS.id,f,editVal);setEditField(null);},onKeyDown:e=>e.key==='Enter'&&(setSessVal(curS.id,f,editVal),setEditField(null)),autoFocus:true,style:{...inp,fontSize:'14px',fontWeight:'700'}})
              :h('div',{onClick:()=>{setEditField({sessId:curS.id,field:f});setEditVal(getSessVal(curS.id,f)||v||'');},style:{padding:'10px 12px',background:'#F8F8F8',borderRadius:'8px',fontSize:'14px',fontWeight:'700',cursor:'pointer',minHeight:'40px'}},v||h('span',{style:{color:'#ccc'}},'— tocar para editar'))
          );
        })
      )
    ),
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'12px'}},'Registro de la semana'),
      h('div',{style:{marginBottom:'14px'}},
        h('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'8px'}},'¿Cumpliste el protocolo?'),
        h('div',{style:{display:'flex',gap:'8px'}},
          h(SelBtn,{val:'Sí',cur:getReg(curS.id,'cumple'),onClick:()=>setReg(curS.id,'cumple','Sí'),color:G}),
          h(SelBtn,{val:'Parcial',cur:getReg(curS.id,'cumple'),onClick:()=>setReg(curS.id,'cumple','Parcial'),color:O})
        ),
        getReg(curS.id,'cumple')==='Parcial'&&h('input',{type:'text',placeholder:'¿Qué fue distinto?',value:getReg(curS.id,'cumpleParcial'),onChange:e=>setReg(curS.id,'cumpleParcial',e.target.value),style:{...inp,marginTop:'8px',fontSize:'13px'}})
      ),
      h('div',{style:{marginBottom:'14px'}},
        h('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'4px'}},'¿Cómo fue la exigencia?'),
        h('div',{style:{fontSize:'11px',color:'#999',marginBottom:'8px'}},'Esperada: '+sensEsp),
        h('div',{style:{display:'flex',gap:'6px'}},
          [{v:'Esperada',c:G},{v:'Mayor',c:O},{v:'Menor',c:B}].map(({v,c})=>h(SelBtn,{key:v,val:v,cur:getReg(curS.id,'exig'),onClick:()=>setReg(curS.id,'exig',v),color:c}))
        )
      ),
      h('div',{style:{marginBottom:'14px'}},
        h('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'8px'}},'Fatiga (mismo día)'),
        h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},
          ['Nada','Moderada','Alta, me limitó'].map(v=>h(SelBtn,{key:v,val:v,cur:getReg(curS.id,'fatiga'),onClick:()=>setReg(curS.id,'fatiga',v)}))
        )

        h('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'8px'}},'Dolor muscular (1-2 días después)'),
        h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},

        )
      ),

        h('div',{style:{fontSize:'13px',fontWeight:'700',marginBottom:'8px'}},'Nota libre (opcional)'),
        h('textarea',{placeholder:'Cómo te sentiste, condiciones del día, etc.',value:getReg(curS.id,'nota'),onChange:e=>setReg(curS.id,'nota',e.target.value),style:{...inp,minHeight:'70px',resize:'none',fontSize:'13px'}})
      )

}

function Login({onLogin}){
  const [name,setName]=useState('');

      h('input',{type:'text',placeholder:'Tu nombre',value:name,onChange:e=>setName(e.target.value),onKeyDown:e=>e.key==='Enter'&&name.trim()&&onLogin(name.trim()),style:{...inp,fontSize:'17px',padding:'14px',marginBottom:'12px'},autoFocus:true}),
      h('button',{onClick:()=>name.trim()&&onLogin(name.trim()),disabled:!name.trim(),style:{width:'100%',background:name.trim()?'#111':'#E0E0E0',color:name.trim()?'#fff':'#999',border:'none',borderRadius:'10px',padding:'14px',fontSize:'16px',fontWeight:'700',cursor:name.trim()?'pointer':'default'}},'Entrar')

}

function Training({exes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes}){
  if(!cfg)cfg=defCfg;
  const [configuring,setConfiguring]=useState(false);
  const [activeSess,setActiveSess]=useState('A');
  const [tut,setTut]=useState(null);
  const [editKg,setEditKg]=useState(null);
  const [kgVal,setKgVal]=useState('');
  const [cfgSess,setCfgSess]=useState('A');
  const [calOpen,setCalOpen]=useState(false);
  const [openTec,setOpenTec]=useState(null);
  const SESS=['A','B','C','D'].slice(0,cfg.num);
  const saveCfg=nc=>{setCfg(nc);localStorage.setItem(CFG_KEY(user),JSON.stringify(nc));};
  const toggleEx=(s,id)=>{const cur=cfg.assign[s]||[];const na=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];saveCfg({...cfg,assign:{...cfg.assign,[s]:na}});};
  const setNum=n=>{const na={};['A','B','C','D'].slice(0,n).forEach(s=>{na[s]=cfg.assign[s]||[];});saveCfg({...cfg,num:n,assign:na});};
  const getKg=ex=>sessionKg?.[activeSess]?.[ex.id];
  const getRep=(sess,exId,k)=>sessionReps?.[sess]?.[exId]?.[k]||'';
  const setRep=(sess,exId,k,v)=>{setSessionReps(prev=>{const next={...prev};if(!next[sess])next[sess]={};if(!next[sess][exId])next[sess][exId]={};next[sess][exId][k]=v;return next;});setSaved(false);};
  const bloque=(cfg?.bloque||'volumen').toLowerCase();
  const bloqueInfo=BLOQUES[bloque]||BLOQUES.volumen;
  const seriesBase=Math.min(4,Math.max(2,cfg?.series||2));
  const wkNum=wk?.num||1;
  const bloqueInicio=cfg?.bloqueInicio||1;
  const weeksInBlock=Math.max(0,wkNum-bloqueInicio);
  const numSeries=bloque==='base'?4:bloque==='volumen'?Math.min(4,seriesBase+Math.floor(weeksInBlock/2)):seriesBase;
  const semanasParaSiguienteSerie=(bloque==='volumen'&&numSeries<4)?(2-(weeksInBlock%2)||2):null;
  const hasProgression=bloque==='volumen'||bloque==='intensidad'||bloque==='man';
  const SERIES_KEYS=['r1','r2','r3','r4'].slice(0,numSeries);
  const canIncreaseKg=ex=>{if(!hasProgression)return false;return true;};
  const nKg=ex=>{if(!canIncreaseKg(ex))return null;const curKg=getKg(ex);if(!curKg)return null;const r1=parseInt(sessionReps?.[activeSess]?.[ex.id]?.r1)||0;return r1>=ex.hi?rKg(curKg*1.05):null;};
  const suggestedKg=(ex,i)=>{if(i===0)return null;const prevKey='r'+i;const prevReps=parseInt(sessionReps?.[activeSess]?.[ex.id]?.[prevKey])||0;if(!prevReps)return null;const mitad=(ex.low+ex.hi)/2;if(prevReps>mitad)return null;const curKg=getKg(ex);if(!curKg)return null;return Math.floor(curKg*0.9/2.5)*2.5;};
  const doSaveKg=(ex,val)=>{const kg=parseFloat(val);if(isNaN(kg)||kg<=0)return setEditKg(null);const newSK={...sessionKg};if(!newSK[activeSess])newSK[activeSess]={};newSK[activeSess][ex.id]=kg;setSessionKg(newSK);localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(newSK));setEditKg(null);setSaved(false);};
  const prevBestSet=ex=>{if(!hist||!hist.length)return null;for(let i=hist.length-1;i>=0;i--){const w=hist[i];const reps=w.sr?.[activeSess]?.[ex.id];if(!reps)continue;const r1=parseInt(reps.r1)||0;if(r1===0)continue;const kg=(w.sk?.[activeSess]?.[ex.id])||getKg(ex);if(kg)return{reps:r1,kg};}return null;};
  const calExes=exes.filter(e=>String(e.m||'').toLowerCase()==='calentamiento'&&e.url);
  const rawAssign=cfg.assign[activeSess]||[];
  const findEx=id=>exes.find(e=>e.id==id);
  const sessGroups=rawAssign.reduce((acc,item)=>{
    if(typeof item==='object'&&Array.isArray(item)){acc.push(item);}
    else{acc.push([item]);}
    return acc;
  },[]).map(g=>g.map(id=>findEx(id)).filter(Boolean)).filter(g=>g.length>0&&!g.every(e=>String(e.m||'').toLowerCase()==='calentamiento'));

  if(loadingExes)return h('div',{style:{...card,textAlign:'center',padding:'40px 20px'}},h('div',{style:{fontSize:'30px',marginBottom:'8px'}},'⏳'),h('div',{style:{fontSize:'14px',color:'#999'}},'Cargando ejercicios...'));
  if(configuring)return h('div',null,
    h('div',{style:card},h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},h('div',{style:{fontSize:'15px',fontWeight:'800'}},'⚙️ Configurar rutina'),h('button',{onClick:()=>setConfiguring(false),style:{background:G,color:'#fff',border:'none',borderRadius:'8px',padding:'8px 16px',fontSize:'13px',fontWeight:'700',cursor:'pointer'}},'Listo ✓'))),
    h('div',{style:card},h('div',{style:lbl},'Cantidad de sesiones'),h('div',{style:{display:'flex',gap:'8px'}},[2,3,4].map(n=>h('button',{key:n,onClick:()=>setNum(n),style:{flex:1,padding:'14px',fontSize:'16px',fontWeight:cfg.num===n?'800':'400',cursor:'pointer',borderRadius:'10px',border:'2px solid',color:cfg.num===n?'#fff':'#999',background:cfg.num===n?G:'#fff',borderColor:cfg.num===n?G:'rgba(0,0,0,0.1)'}},n+' sesiones')))),
    h('div',{style:card},h('div',{style:{...lbl,marginBottom:'10px'}},'Ejercicios por sesión'),
      h('div',{style:{display:'flex',gap:'4px',marginBottom:'14px'}},SESS.map(s=>h('button',{key:s,onClick:()=>setCfgSess(s),style:{flex:1,padding:'10px 4px',fontSize:'13px',fontWeight:cfgSess===s?'800':'400',cursor:'pointer',borderRadius:'8px',border:'2px solid',color:cfgSess===s?'#fff':'#999',background:cfgSess===s?B:'#fff',borderColor:cfgSess===s?B:'rgba(0,0,0,0.1)'}},
        'Ses. '+s,' ',h('span',{style:{fontSize:'10px',opacity:0.8}},'('+((cfg.assign[s]||[]).length)+')')
      ))),
      exes.map(ex=>{const assigned=(cfg.assign[cfgSess]||[]).includes(ex.id);
        return h('div',{key:ex.id,onClick:()=>toggleEx(cfgSess,ex.id),style:{display:'flex',alignItems:'center',gap:'12px',padding:'11px 0',borderBottom:'1px solid rgba(0,0,0,0.05)',cursor:'pointer'}},
          h('div',{style:{width:'24px',height:'24px',borderRadius:'6px',border:'2px solid',borderColor:assigned?G:'rgba(0,0,0,0.15)',background:assigned?G:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},assigned&&h('span',{style:{color:'#fff',fontSize:'15px',fontWeight:'900'}},'✓')),
          h('div',null,h('div',{style:{fontSize:'14px',fontWeight:'600',color:'#111'}},ex.n),h('div',{style:{fontSize:'11px',color:'#999',marginTop:'1px'}},ex.m+' · '+ex.low+'–'+ex.hi+' reps'))
        );
      })
    )
  );

  return h('div',null,
    h('div',{style:card},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
        h('div',{style:lbl},'Sesión de hoy'),

    try{const sk=localStorage.getItem(`bas_${user}_sessKg`);if(sk)setSessionKg(JSON.parse(sk)||{});}catch(e){}
    setExesReady(false);setLoadingExes(true);
    fetch(SCRIPT_URL+'?action=ejercicios')
      .then(r=>r.json())
      .then(rows=>{
        if(rows&&rows.length>0){
          const exData=rows.map((r,i)=>({id:i+1,n:String(r.Nombre||r.NOMBRE||''),m:String(r.Musculo||r.Músculo||r.MÚSCULO||''),low:parseInt(r.RepMin)||8,hi:parseInt(r.RepMax)||12,url:String(r.Tutorial||''),r1:'',r2:''}));
          setExes(exData);

  },[user]);

  useEffect(()=>{
    if(!user||!exesReady)return;
    fetch(SCRIPT_URL+'?action=rutinas')
      .then(r=>r.json())
      .then(rutinas=>{
        const fila=rutinas.find(r=>String(r.Asesorado||'').trim().toLowerCase()===user.trim().toLowerCase());
        if(fila){
          const num=parseInt(fila.NumSesiones)||3;
          const assign={};
          const norm2=n=>n.trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
          ['A','B','C','D'].slice(0,num).forEach(s=>{
            const nombres=String(fila['Sesion'+s]||'').split(',').map(n=>n.trim()).filter(Boolean);
            assign[s]=nombres.map(nombre=>{
              if(nombre.includes('+')){
                return nombre.split('+').map(n=>{const ex=exes.find(e=>norm2(e.n)===norm2(n.trim()));return ex?ex.id:null;}).filter(Boolean);
              }
              const ex=exes.find(e=>norm2(e.n)===norm2(nombre.trim()));
              return ex?ex.id:null;
            }).filter(v=>v!==null);
          });
          const newCfg={num,assign,series:Math.min(4,Math.max(2,parseInt(fila.Series)||2)),bloque:String(fila.Bloque||'volumen').toLowerCase().trim(),bloqueInicio:parseInt(fila.BloqueInicio)||1,hiit:['A','B','C','D'].map(s=>{const nom=String(fila['HIIT'+s]||'').trim();if(!nom)return null;return{id:s,nom,detalle:String(fila['HIIT'+s+'Detalle']||'').trim(),ritmo:String(fila['HIIT'+s+'Ritmo']||'').trim()};}).filter(Boolean)};setCfg(newCfg);localStorage.setItem(CFG_KEY(user),JSON.stringify(newCfg));
          const fechaInicio=String(fila.FechaInicio||'').trim();
          if(fechaInicio){localStorage.setItem(`bas_${user}_startdate`,fechaInicio);}
          else if(!localStorage.getItem(`bas_${user}_startdate`)){localStorage.setItem(`bas_${user}_startdate`,new Date().toISOString().split('T')[0]);}
        }

    const id=`sem_${num||1}`;

      const draft=localStorage.getItem(`bas_${user}_draft_${id}`);

      const d=draft?JSON.parse(draft):(saved?JSON.parse(saved):null);
      if(d){if(d.sr)setSessionReps(d.sr);else setSessionReps({});if(d.hiit)setHiitData(d.hiit);else setHiitData(iHiit());setSaved(!!saved);}
      else{setSessionReps({});setHiitData(iHiit());setSaved(false);}
    }catch(e){setSessionReps({});setHiitData(iHiit());setSaved(false);}
    loadH();
  }
  function loadH(){
    try{const list=JSON.parse(localStorage.getItem(HK(user))||'[]');const w=list.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,user)));}catch(e){return null;}}).filter(Boolean).sort((a,b)=>(a.wi||'').localeCompare(b.wi||''));setHist(w);}catch(e){setHist([]);}

      const newSK={...sessionKg};

        Object.entries(sessData).forEach(([exId,reps])=>{
          const curKg=(sessionKg[sess]?.[exId]);if(!curKg)return;
          const best=parseInt(reps.r1)||0;

          if(ex&&best>=ex.hi){if(!newSK[sess])newSK[sess]={};newSK[sess][exId]=rKg(curKg*1.05);}
        });
      });
      setSessionKg(newSK);localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(newSK));
      const d={wi:wk.id,wl:wk.label,sr:curSR,sk:newSK,e:exes,hiit:hiitData};
      localStorage.setItem(SK(wk.id,user),JSON.stringify(d));

      if(!list.includes(wk.id)){list.push(wk.id);localStorage.setItem(HK(user),JSON.stringify(list));}

      h('div',{style:{display:'flex',flexDirection:'column',gap:'5px',alignItems:'flex-end'}},
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px'}},
          h('button',{onClick:saveProgress,disabled:saving,style:{borderRadius:'8px',padding:'8px 10px',fontSize:'11px',fontWeight:'700',cursor:'pointer',border:'1px solid rgba(0,0,0,0.12)',background:saved==='progreso'?'#EBF4FF':'#fff',color:saved==='progreso'?B:'#555'}},saving?'...':(saved==='progreso'?'✓ Progreso':'Guardar progreso')),
          h('button',{onClick:save,disabled:saving||saved===true,style:{borderRadius:'8px',padding:'8px 10px',fontSize:'11px',fontWeight:'700',cursor:saving||saved===true?'default':'pointer',border:'none',background:saved===true?'#EAF7F2':'#111',color:saved===true?G:'#fff'}},saving?'...':(saved===true?'✓ Sem. guardada':'Guardar semana')),
          h('button',{onClick:resetWeek,style:{borderRadius:'8px',padding:'8px 10px',fontSize:'11px',fontWeight:'600',cursor:'pointer',border:'1px solid rgba(239,68,68,0.3)',background:'#FFF5F5',color:'#EF4444'}},'↺ Resetear'),
          h('button',{onClick:prevWeek,disabled:(wk.num||1)<=1,style:{borderRadius:'8px',padding:'8px 10px',fontSize:'11px',fontWeight:'600',cursor:(wk.num||1)<=1?'default':'pointer',border:'1px solid rgba(0,0,0,0.1)',background:'#F8F8F8',color:(wk.num||1)<=1?'#ccc':'#555'}},'← Sem anterior'),
          h('button',{onClick:newWeek,style:{borderRadius:'8px',padding:'8px 10px',fontSize:'11px',fontWeight:'600',cursor:'pointer',border:'1px solid rgba(0,0,0,0.1)',background:'#F8F8F8',color:'#555'}},'Nueva sem →')
        )
      )
    ),
    h('div',{style:{padding:'14px',paddingBottom:'80px'}},
      tab==='d'&&h(Dashboard,null),
      tab==='t'&&h(Training,{key:'t',exes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes}),
      tab==='hiit'&&h(Hiit,{key:'hiit',cfg,hiitData,setHiitData,setSaved})
    ),
    h('div',{style:{background:'#fff',borderTop:'1px solid rgba(0,0,0,0.08)',display:'flex',position:'sticky',bottom:0,zIndex:10}},
      TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'12px 2px 16px',fontSize:'12px',background:'none',border:'none',borderTop:tab===t.id?'2px solid #111':'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',color:tab===t.id?'#111':'#999',fontWeight:tab===t.id?'700':'400'}},
        h('span',{style:{fontSize:'22px'}},t.ic),t.l
      ))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
