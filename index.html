// ── SEMANAS ──────────────────────────────────────────────────────────
function getWkForNum(user,num){
  const startId=localStorage.getItem(`bas_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label,mon:wkMon,sun:wkSun};
}
function getRealWkNum(user){
  const startId=localStorage.getItem(`bas_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const today=new Date();today.setHours(12,0,0,0);
  const diffMs=today-startMon;
  if(diffMs<0)return 1;
  return Math.floor(diffMs/(7*24*60*60*1000))+1;
}
function getWkSat(user,num){
  const wk=getWkForNum(user,num);
  const sat=new Date(wk.mon);sat.setDate(wk.mon.getDate()+5);sat.setHours(23,59,59,999);
  return sat;
}

// ── SESIÓN 5 DÍAS ────────────────────────────────────────────────────
// Patrón continuo ABCABCABC... 5 días por semana
// Sem1: ABCAB, Sem2: CABCA, Sem3: BCABC...
function getSession5(wkNum,dayOfWeek){
  // dayOfWeek: 1=Lun...5=Vie
  const dayIdx=dayOfWeek-1;
  const pos=(wkNum-1)*5+dayIdx;
  return ['A','B','C'][pos%3];
}
function getTodaySession5(wkNum){
  const today=new Date();
  const dow=today.getDay(); // 0=Dom,1=Lun...6=Sab
  if(dow===0||dow===6)return null; // fin de semana
  return getSession5(wkNum,dow);
}

// ── CHART ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=120,labels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:10,b:24,l:32,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-5,textAnchor:'middle',fontSize:'9',fill:'#aaa'},l):null),
    h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mn.toFixed(1)),
    h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mx.toFixed(1))
  );
}

// ── ONBOARDING ───────────────────────────────────────────────────────
function Onboarding({user,onDone}){
  const [sel,setSel]=useState(null);
  const SPLITS=[
    {n:'3H', label:'3 días — Hombre', sub:'Full Body · 3 sesiones A / B / C',              ic:'🔄'},
    {n:'3M', label:'3 días — Mujer',  sub:'Full Body · 3 sesiones A / B / C',              ic:'🔄'},
    {n:'4H', label:'4 días — Hombre', sub:'Torso-Pierna · 4 sesiones A / B / C / D',       ic:'🏋️'},
    {n:'4M', label:'4 días — Mujer',  sub:'Torso-Pierna · 4 sesiones A / B / C / D',       ic:'🏋️'},
    {n:'5H', label:'5 días — Hombre', sub:'PPL · 3 sesiones rotativas A / B / C',          ic:'💪'},
    {n:'5M', label:'5 días — Mujer',  sub:'Glut-Fem / Cuads / Torso · 3 sesiones rotativas',ic:'💪'},
  ];
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',minHeight:'100vh',background:'#0A0A0A',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px'}},
    h('div',{style:{textAlign:'center',marginBottom:'28px'}},
      h('div',{style:{fontSize:'44px',marginBottom:'12px'}},'🗓'),
      h('div',{style:{fontSize:'20px',fontWeight:'900',color:'#fff',marginBottom:'4px'}},'Elegí tu rutina'),
      h('div',{style:{fontSize:'12px',color:'rgba(255,255,255,0.4)',letterSpacing:'0.08em'}},'Podés cambiarla cuando quieras')
    ),
    h('div',{style:{fontSize:'11px',fontWeight:'700',color:'rgba(255,255,255,0.4)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'12px'}},'¿Cuántos días por semana entrenás?'),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',width:'100%',maxWidth:'320px',marginBottom:'24px'}},
      SPLITS.map(s=>h('button',{key:s.n,onClick:()=>setSel(s.n),style:{padding:'14px 16px',borderRadius:'12px',border:`2px solid ${sel===s.n?AC:'rgba(255,255,255,0.1)'}`,background:sel===s.n?AC+'22':'rgba(255,255,255,0.04)',cursor:'pointer',textAlign:'left',transition:'all 0.15s'}},
        h('div',{style:{fontSize:'15px',fontWeight:'800',color:sel===s.n?AC:'#fff'}},s.ic+' '+s.label),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.45)',marginTop:'2px'}},s.sub)
      ))
    ),
    h('button',{onClick:()=>{if(!sel)return;localStorage.setItem(`bas_${user}_split`,sel);onDone(sel);},disabled:!sel,style:{width:'100%',maxWidth:'320px',background:sel?GRAD:'rgba(255,255,255,0.1)',color:'#fff',border:'none',borderRadius:'12px',padding:'16px',fontSize:'16px',fontWeight:'800',cursor:sel?'pointer':'default',letterSpacing:'0.02em'}},'Empezar →')
  );
}

// ── LOGIN ─────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [name,setName]=useState('');
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',minHeight:'100vh',background:'#0A0A0A',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px'}},
    h('div',{style:{marginBottom:'32px',textAlign:'center'}},
      h('div',{style:{fontSize:'52px',marginBottom:'16px'}},'🏋️'),
      h('div',{style:{fontSize:'26px',fontWeight:'900',color:'#fff',letterSpacing:'-0.5px',marginBottom:'6px'}},'Entrenamiento'),
      h('div',{style:{fontSize:'13px',color:'rgba(255,255,255,0.4)',letterSpacing:'0.15em',textTransform:'uppercase'}},'Fuerza T · Registrá tu progreso')
    ),
    h('div',{style:{width:'100%',maxWidth:'320px'}},
      h('div',{style:{...lbl,color:'rgba(255,255,255,0.4)',marginBottom:'8px'}},'¿Cómo te llamás?'),
      h('input',{type:'text',placeholder:'Tu nombre',value:name,onChange:e=>setName(e.target.value),onKeyDown:e=>e.key==='Enter'&&name.trim()&&onLogin(name.trim()),style:{...inp,fontSize:'17px',padding:'16px',marginBottom:'16px',background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.12)',color:'#fff',borderRadius:'12px'},autoFocus:true}),
      h('button',{onClick:()=>name.trim()&&onLogin(name.trim()),disabled:!name.trim(),style:{width:'100%',background:name.trim()?GRAD:'rgba(255,255,255,0.1)',color:name.trim()?'#fff':'rgba(255,255,255,0.3)',border:'none',borderRadius:'12px',padding:'16px',fontSize:'16px',fontWeight:'800',cursor:name.trim()?'pointer':'default',letterSpacing:'0.02em'}},'Entrar →')
    )
  );
}

// ── TRAINING ─────────────────────────────────────────────────────────
function Training({user,split,rutinas,exes,wkNum,isViewingPast,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,setSaved}){
  const SERIES_KEYS=['r1','r2','r3'];
  const LOW_LOAD_BANNER={
    1:'Semana 1: usá pesos livianos. El objetivo es aprender el movimiento, no el esfuerzo.',
    2:'Semana 2: podés subir un poco el peso. Todavía no es el peso de trabajo real.',
  };

  // Sesiones disponibles según split
  const is5day=split==='5H'||split==='5M';
  const is4day=split==='4H'||split==='4M';
  const sesiones=is4day?['A','B','C','D']:['A','B','C'];
  // Sesión activa: para 5 días es automática, para 3/4 es manual
  const todaySess=is5day?getTodaySession5(wkNum):null;
  const [activeSess,setActiveSess]=useState(()=>todaySess||'A');

  // Ejercicios de la sesión activa
  const sessExes=useMemo(()=>{
    if(!rutinas||!rutinas[split])return[];
    const raw=rutinas[split][activeSess]||[];
    return raw.map(item=>{
      if(Array.isArray(item))return item.map(n=>exes.find(e=>e.n===n)||{n,low:8,hi:12,url:''}).filter(Boolean);
      return[exes.find(e=>e.n===item)||{n:item,low:8,hi:12,url:''}];
    }).filter(g=>g.length>0);
  },[rutinas,split,activeSess,exes]);

  const [tut,setTut]=useState(null);
  const [editKg,setEditKg]=useState(null);
  const [kgVal,setKgVal]=useState('');
  const [exEquiv,setExEquiv]=useState(null);

  // Kg por nombre de ejercicio (cross-split, cross-session)
  const getKg=exName=>sessionKg?.[exName];
  const setKgForEx=(exName,kg)=>{
    const newSK={...sessionKg,[exName]:kg};
    setSessionKg(newSK);
    const normSK={};Object.entries(newSK).forEach(([n,k])=>{normSK[n]=k;});
    localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(normSK));
    setSaved(false);
  };

  // Reps por sesión → ejercicio (por nombre)
  const getRep=(sess,exName,k)=>sessionReps?.[sess]?.[exName]?.[k]||'';
  const setRep=(sess,exName,k,v)=>{
    setSessionReps(prev=>{
      const next={...prev};
      if(!next[sess])next[sess]={};
      if(!next[sess][exName])next[sess][exName]={};
      next[sess][exName][k]=v;
      return next;
    });
    setSaved(false);
  };

  // PR anterior: busca en TODO el historial por nombre de ejercicio, cualquier sesión
  const getPR=exName=>{
    if(!hist||!hist.length)return null;
    for(let i=hist.length-1;i>=0;i--){
      const w=hist[i];
      const sr=w.sr||{};
      for(const sess of Object.keys(sr)){
        const data=sr[sess]?.[exName];
        if(!data)continue;
        const r1=parseInt(data.r1)||0;
        if(r1===0)continue;
        const kg=(w.skUsed?.[exName])||(w.sk?.[exName])||getKg(exName)||0;
        return{reps:r1,kg};
      }
    }
    return null;
  };

  // Sugerencia de kg siguiente
  const nKg=(exName,ex)=>{
    const curKg=getKg(exName);if(!curKg)return null;
    if(wkNum<3)return null; // sem 1 y 2 sin progresión automática
    const r1=parseInt(sessionReps?.[activeSess]?.[exName]?.r1)||0;
    return r1>=(ex.hi||12)?rKg(curKg*1.05):null;
  };

  const doSaveKg=(exName,val)=>{
    const kg=parseFloat(val);if(isNaN(kg)||kg<=0)return setEditKg(null);
    setKgForEx(exName,kg);setEditKg(null);
  };

  // Equivalentes: mismo grupo muscular
  const getEquivs=ex=>exes.filter(e=>e.m===ex.m&&e.n!==ex.n);

  if(!rutinas||!rutinas[split]){
    return h('div',{style:{...card,textAlign:'center',padding:'32px'}},
      h('div',{style:{fontSize:'30px',marginBottom:'8px'}},'⏳'),
      h('div',{style:{fontSize:'14px',color:'#999'}},rutinas?'No hay rutina para este split':'Cargando rutinas...')
    );
  }

  return h('div',null,
    // Modal equivalencias
    exEquiv&&h('div',{onClick:()=>setExEquiv(null),style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:100,display:'flex',alignItems:'flex-end'}},
      h('div',{onClick:e=>e.stopPropagation(),style:{background:'#fff',borderRadius:'20px 20px 0 0',width:'100%',maxWidth:'480px',margin:'0 auto',padding:'20px 16px 36px',maxHeight:'70vh',overflowY:'auto',animation:'fadeIn 0.2s ease'}},
        h('div',{style:{width:'36px',height:'4px',background:'#E0E0E0',borderRadius:'2px',margin:'0 auto 16px'}}),
        h('div',{style:{fontSize:'11px',fontWeight:'700',color:'#888',marginBottom:'4px',letterSpacing:'0.08em',textTransform:'uppercase'}},'Equivalentes — '+(exEquiv.m||'mismo músculo')),
        h('div',{style:{fontSize:'16px',fontWeight:'900',color:'#0A0A0A',marginBottom:'16px'}},'¿No podés hacer '+exEquiv.n+'?'),
        getEquivs(exEquiv).length===0
          ?h('div',{style:{fontSize:'13px',color:'#bbb',textAlign:'center',padding:'20px 0'}},'No hay ejercicios equivalentes')
          :getEquivs(exEquiv).map((e,i,arr)=>h('div',{key:e.n,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:i<arr.length-1?'1px solid rgba(0,0,0,0.06)':'none'}},
            h('div',null,h('div',{style:{fontSize:'14px',fontWeight:'700',color:'#0A0A0A'}},e.n),h('div',{style:{fontSize:'11px',color:'#888',marginTop:'2px'}},e.low+'–'+e.hi+' reps')),
            e.url&&h('a',{href:e.url,target:'_blank',rel:'noreferrer',style:{fontSize:'11px',color:AC,fontWeight:'700',textDecoration:'none'}},'▶ Ver')
          ))
      )
    ),

    // Banner semana 1/2/3
    LOW_LOAD_BANNER[wkNum]
      ?h('div',{style:{...card,background:'#0A0A0A',border:'none',marginBottom:'10px'}},
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.65)',lineHeight:'1.6',borderLeft:`3px solid ${AC}`,paddingLeft:'10px'}},LOW_LOAD_BANNER[wkNum])
        )
      :h('div',{style:{...card,background:'#0A0A0A',border:'none',marginBottom:'10px'}},
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.65)',lineHeight:'1.6',borderLeft:`3px solid ${AC}`,paddingLeft:'10px'}},'A partir de acá entrenás con pesos máximos. Cuando llegues al techo de reps, los kg suben solos.')
        ),

    // Selector sesión
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'8px'}},is5day?'Sesión de hoy (rotación automática)':'Sesión de hoy'),
      is5day&&todaySess
        ?h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
            h('div',{style:{fontSize:'28px',fontWeight:'900',color:AC}},todaySess),
            h('div',null,
              h('div',{style:{fontSize:'13px',fontWeight:'700',color:'#111'}},'Sesión '+todaySess),
              h('div',{style:{fontSize:'11px',color:'#888'}},'Patrón automático sem '+wkNum)
            )
          )
        :is5day&&!todaySess
        ?h('div',{style:{fontSize:'13px',color:'#888',padding:'8px 0'}},'Hoy es fin de semana — descansá 💤')
        :h('div',{style:{display:'flex',gap:'6px'}},
            sesiones.map(s=>h('button',{key:s,onClick:()=>!isViewingPast&&setActiveSess(s),style:{flex:1,padding:'10px 4px',fontSize:'16px',fontWeight:'900',cursor:isViewingPast?'default':'pointer',border:`2px solid ${activeSess===s?AC:'rgba(0,0,0,0.1)'}`,borderRadius:'10px',color:activeSess===s?AC:'#999',background:activeSess===s?AC+'12':'#fff',transition:'all 0.15s'}},s))
          )
    ),

    // Ejercicios
    sessExes.length===0
      ?h('div',{style:{...card,textAlign:'center',padding:'24px',color:'#999'}},'Sin ejercicios para esta sesión')
      :sessExes.map((group,gi)=>{
        const isBiserie=group.length>1;
        const exCard=ex=>{
          const exName=ex.n;
          const pr=getPR(exName);
          const curKg=getKg(exName);
          const nk=nKg(exName,ex);
          const to=tut===exName;
          const editing=editKg===exName;
          return h('div',{key:exName,style:isBiserie?{paddingBottom:'12px',marginBottom:'10px',borderBottom:'1px solid rgba(0,0,0,0.06)'}:{}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}},
              h('div',{style:{flex:1,paddingRight:'8px'}},
                h('div',{style:{fontWeight:'800',fontSize:'15px',color:'#0A0A0A'}},exName),
                h('div',{style:{display:'flex',gap:'6px',marginTop:'6px',alignItems:'center',flexWrap:'wrap'}},
                  ex.m&&h('span',{style:{fontSize:'11px',background:'#F0EFED',color:'#555',padding:'2px 8px',borderRadius:'20px',fontWeight:'600'}},ex.m),
                  ex.url&&h('button',{onClick:()=>setTut(to?null:exName),style:{background:'none',border:'none',cursor:'pointer',fontSize:'11px',color:'#888',textDecoration:'underline'}},to?'Cerrar':'Tutorial'),
                  getEquivs(ex).length>0&&h('button',{onClick:()=>setExEquiv(ex),style:{background:'none',border:'none',cursor:'pointer',fontSize:'11px',color:AC,fontWeight:'700'}},'≡ Equiv.')
                ),
                pr&&h('div',{style:{marginTop:'5px',fontSize:'11px',color:G,fontWeight:'700'}},'Ant.: '+pr.reps+' × '+pr.kg+' kg')
              ),
              h('div',{style:{textAlign:'right',flexShrink:0}},
                editing
                  ?h('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},
                      h('input',{type:'text',inputMode:'decimal',value:kgVal,onChange:e=>setKgVal(e.target.value),onKeyDown:e=>e.key==='Enter'&&doSaveKg(exName,kgVal),onBlur:()=>doSaveKg(exName,kgVal),autoFocus:true,style:{width:'64px',textAlign:'center',fontSize:'18px',fontWeight:'700',padding:'4px 6px',border:`2px solid ${G}`,borderRadius:'6px'}}),
                      h('span',{style:{fontSize:'13px',color:'#999'}},'kg')
                    )
                  :curKg!==undefined
                    ?h('div',{onClick:()=>{if(!isViewingPast){setEditKg(exName);setKgVal(String(curKg));}},style:{cursor:isViewingPast?'default':'pointer'}},
                        h('div',{style:{fontSize:'22px',fontWeight:'800'}},curKg,' ',h('span',{style:{fontSize:'13px',color:'#999'}},'kg')),
                        !isViewingPast&&h('div',{style:{fontSize:'10px',color:'#ccc',textAlign:'right'}},'toca para editar')
                      )
                    :h('div',{onClick:()=>{if(!isViewingPast){setEditKg(exName);setKgVal('');}},style:{cursor:isViewingPast?'default':'pointer',textAlign:'right'}},
                        h('div',{style:{fontSize:'22px',fontWeight:'800',color:'#DDD'}},'— kg'),
                        !isViewingPast&&h('div',{style:{fontSize:'10px',color:AC,fontWeight:'600'}},'establecer peso')
                      ),
                h('div',{style:{fontSize:'11px',color:'#999',marginTop:'2px'}},(ex.low||8)+'–'+(ex.hi||12)+' reps')
              )
            ),
            to&&ex.url&&h('div',{style:{background:'#EBF4FF',borderRadius:'8px',padding:'10px 12px',marginBottom:'10px'}},
              h('a',{href:ex.url,target:'_blank',rel:'noreferrer',style:{fontSize:'13px',color:B,fontWeight:'600',textDecoration:'none'}},'▶ Ver tutorial')
            ),
            !isViewingPast&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:nk?'10px':'0'}},
              SERIES_KEYS.map((k,i)=>h('div',{key:k},
                h('div',{style:lbl},'Serie '+(i+1)),
                h('input',{type:'text',inputMode:'numeric',placeholder:'Reps',value:getRep(activeSess,exName,k),onChange:e=>setRep(activeSess,exName,k,e.target.value),style:{...inp,textAlign:'center',fontSize:'22px',fontWeight:'700'}})
              ))
            ),
            isViewingPast&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'0'}},
              SERIES_KEYS.map((k,i)=>h('div',{key:k},
                h('div',{style:lbl},'Serie '+(i+1)),
                h('div',{style:{...inp,textAlign:'center',fontSize:'22px',fontWeight:'700',color:'#aaa',display:'flex',alignItems:'center',justifyContent:'center',minHeight:'48px'}},getRep(activeSess,exName,k)||'—')
              ))
            ),
            nk&&!isViewingPast&&h('div',{style:{background:'#EAF7F2',border:'1px solid #A3DFC8',borderRadius:'8px',padding:'10px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
              h('span',{style:{fontSize:'12px',color:G,fontWeight:'600'}},'Próxima sesión'),
              h('span',{style:{fontWeight:'800',color:G,fontSize:'15px'}},'↑ '+nk+' kg')
            )
          );
        };
        if(isBiserie)return h('div',{key:'g'+gi,style:card},
          h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}},
            h('div',{style:{flex:1,height:'1px',background:'rgba(0,0,0,0.08)'}}),
            h('span',{style:{fontSize:'10px',fontWeight:'800',color:'#999',letterSpacing:'0.1em'}},group.length>2?'SERIE GIGANTE':'BISERIE'),
            h('div',{style:{flex:1,height:'1px',background:'rgba(0,0,0,0.08)'}})
          ),
          group.map(ex=>exCard(ex))
        );
        return h('div',{key:'g'+gi,style:card},exCard(group[0]));
      })
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────
function Dashboard({user,hist,exes,rutinas,split}){
  const [selEx,setSelEx]=useState(0);

  // Ejercicios con historial
  const exNames=useMemo(()=>{
    const names=new Set();
    hist.forEach(w=>{if(w.sr)Object.values(w.sr).forEach(s=>Object.keys(s).forEach(n=>names.add(n)));});
    return Array.from(names).sort();
  },[hist]);

  const e1rmHist=useMemo(()=>{
    const name=exNames[selEx];if(!name)return[];
    return hist.map(w=>{
      let best=0,bestKg=0;
      Object.values(w.sr||{}).forEach(s=>{
        const data=s[name];if(!data)return;
        const r1=parseInt(data.r1)||0;
        const kg=(w.skUsed?.[name])||(w.sk?.[name])||0;
        if(r1>0&&kg>0){const e1=Math.round(kg*(1+r1/30)*10)/10;if(e1>best){best=e1;bestKg=kg;}}
      });
      return best>0?{e1rm:best,kg:bestKg,label:w.wi?.slice(5)||''}:null;
    }).filter(Boolean);
  },[hist,exNames,selEx]);

  if(!hist.length)return h('div',{style:{...card,textAlign:'center',padding:'40px 20px'}},
    h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'📊'),
    h('div',{style:{fontSize:'14px',fontWeight:'600',color:'#333',marginBottom:'6px'}},'Tu progreso aparece acá'),
    h('div',{style:{fontSize:'13px',color:'#999'}},'Guardá tu primera semana para ver las estadísticas.')
  );

  return h('div',null,
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'8px'}},'e1RM — seleccioná ejercicio'),
      exNames.length===0
        ?h('div',{style:{fontSize:'13px',color:'#bbb',textAlign:'center',padding:'16px'}},'Sin datos de entrenamiento todavía')
        :h('div',null,
            h('select',{value:selEx,onChange:e=>setSelEx(parseInt(e.target.value)),style:{...inp,marginBottom:'10px',fontSize:'13px'}},
              exNames.map((n,i)=>h('option',{key:i,value:i},n))
            ),
            e1rmHist.length>=2
              ?h('div',null,
                  h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center'}},
                    h('div',{style:{flex:1,background:'#F8F8F8',borderRadius:'10px',padding:'12px',textAlign:'center'}},
                      h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'700',letterSpacing:'0.06em',marginBottom:'4px'}},'INICIO'),
                      h('div',{style:{fontSize:'20px',fontWeight:'900'}},e1rmHist[0].kg+' kg')
                    ),
                    h('div',{style:{fontSize:'22px',color:'#ccc'}},'→'),
                    h('div',{style:{flex:1,background:'#EAF7F2',border:'1px solid #A3DFC8',borderRadius:'10px',padding:'12px',textAlign:'center'}},
                      h('div',{style:{fontSize:'10px',color:G,fontWeight:'700',letterSpacing:'0.06em',marginBottom:'4px'}},'AHORA'),
                      h('div',{style:{fontSize:'20px',fontWeight:'900',color:G}},e1rmHist[e1rmHist.length-1].kg+' kg')
                    )
                  ),
                  h(LineChart,{data:e1rmHist.map(v=>v.e1rm),color:G,h:110,labels:e1rmHist.map(v=>v.label)})
                )
              :h('div',{style:{textAlign:'center',color:'#bbb',padding:'16px',fontSize:'12px'}},'Guardá al menos 2 semanas para ver la progresión')
          )
    ),
    hist.length>0&&h('div',{style:card},
      h('div',{style:lbl},'Semanas guardadas'),
      hist.slice().reverse().map((w,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:i<hist.length-1?'1px solid rgba(0,0,0,0.06)':'none',fontSize:'13px'}},
        h('span',{style:{color:'#666'}},w.wl||w.wi),
        h('span',{style:{color:'#999',fontSize:'12px'}},w.split||split)
      ))
    )
  );
}

// ── APP ───────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(()=>localStorage.getItem(USER_KEY));
  const [split,setSplit]=useState(()=>{
    const u=localStorage.getItem(USER_KEY);
    if(!u)return null;
    return localStorage.getItem(`bas_${u}_split`)||null;
  }); // '3','4','5'
  const [rutinas,setRutinas]=useState(null); // parsed from sheet
  const [exes,setExes]=useState([]); // all exercises for equivalents
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState('d');
  const [wk,setWk]=useState({id:'sem_1',num:1,label:'...'});
  const [hist,setHist]=useState([]);
  const [sessionReps,setSessionReps]=useState({});
  const [sessionKg,setSessionKg]=useState({});
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const draftReady=useRef(false);
  const sessionRepsRef=useRef({});
  sessionRepsRef.current=sessionReps;

  // Calendar
  const realWkNum=user?getRealWkNum(user):1;
  const isViewingPast=wk.num<realWkNum;
  const wkSat=user?getWkSat(user,wk.num):new Date();
  const wkFinished=new Date()>wkSat;
  const canSaveWeek=wk.num===realWkNum&&wkFinished;
  const weekLocked=isViewingPast;

  useEffect(()=>{
    if(!user)return;
    const sp=localStorage.getItem(`bas_${user}_split`);
    if(sp)setSplit(sp);
    if(!localStorage.getItem(`bas_${user}_startdate`)){
      localStorage.setItem(`bas_${user}_startdate`,new Date().toISOString().split('T')[0]);
    }
    const realNum=getRealWkNum(user);
    const storedNum=parseInt(localStorage.getItem(`bas_${user}_wknum`))||1;
    const correctedNum=Math.min(storedNum,realNum);
    if(correctedNum!==storedNum)localStorage.setItem(`bas_${user}_wknum`,String(correctedNum));
    setWk(getWkForNum(user,correctedNum));

    // Restaurar draft
    try{
      const draftStr=localStorage.getItem(`bas_${user}_draft_sem_${correctedNum}`);
      const savedStr=localStorage.getItem(SK(`sem_${correctedNum}`,user));
      const d=draftStr?JSON.parse(draftStr):(savedStr?JSON.parse(savedStr):null);
      if(d&&d.sr)setSessionReps(d.sr);
      setSaved(!!savedStr);
    }catch(e){}

    // Restaurar kg
    try{
      const sk=localStorage.getItem(`bas_${user}_sessKg`);
      if(sk)setSessionKg(JSON.parse(sk)||{});
    }catch(e){}

    loadH(user);
    setLoading(true);
    // Cargar ejercicios y rutinas en paralelo
    Promise.all([
      fetch(SCRIPT_URL+'?action=ejercicios').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=rutinasbasicas').then(r=>r.json()).catch(()=>[])
    ]).then(([exRows,rutRows])=>{
      // Ejercicios (para equivalencias y datos)
      const parsed=exRows.map((r,i)=>({
        id:i+1,
        n:String(r.Nombre||r.NOMBRE||r.nombre||'').trim(),
        m:String(r.Musculo||r.Músculo||r.MÚSCULO||'').trim(),
        low:parseInt(r.RepMin||r['Rep Min'])||8,
        hi:parseInt(r.RepMax||r['Rep Max'])||12,
        url:String(r.Tutorial||r.TUTORIAL||'').trim()
      })).filter(e=>e.n);
      setExes(parsed);

      // Rutinas básicas: {Split, Dias, Sesiones, SesionA, SesionB, SesionC, SesionD}
      // Una fila por split → {3:{A:[...],B:[...],C:[]}, 4H:{A:[...],B:[...],C:[...],D:[]}, ...}
      const rt={};
      const parseExList=str=>{
        if(!str)return[];
        // Separar por coma, pero respetar + para biseries
        return str.split(',').map(s=>s.trim()).filter(Boolean).map(item=>{
          if(item.includes('+'))return item.split('+').map(n=>n.trim()).filter(Boolean);
          return item;
        });
      };
      rutRows.forEach(r=>{
        const sp=String(r.Split||'').trim();
        if(!sp)return;
        rt[sp]={};
        const numSess=parseInt(r.Sesiones)||3;
        ['A','B','C','D'].slice(0,numSess).forEach(s=>{
          const raw=String(r['Sesion'+s]||'').trim();
          rt[sp][s]=parseExList(raw);
        });
      });
      setRutinas(rt);
    }).catch(()=>{}).finally(()=>{setLoading(false);draftReady.current=true;});
  },[user]);

  function loadH(u){
    try{
      const list=JSON.parse(localStorage.getItem(HK(u||user))||'[]');
      const w=list.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,u||user)));}catch(e){return null;}}).filter(Boolean).sort((a,b)=>(a.wi||'').localeCompare(b.wi||''));
      setHist(w);
    }catch(e){setHist([]);}
  }

  function load(num){
    try{
      const draft=localStorage.getItem(`bas_${user}_draft_sem_${num}`);
      const sv=localStorage.getItem(SK(`sem_${num}`,user));
      const d=draft?JSON.parse(draft):(sv?JSON.parse(sv):null);
      if(d&&d.sr)setSessionReps(d.sr);else setSessionReps({});
      setSaved(!!sv);
    }catch(e){setSessionReps({});setSaved(false);}
  }

  // Auto-save draft
  useEffect(()=>{
    if(!user||!wk.id||!draftReady.current)return;
    const hasReps=Object.values(sessionReps).some(s=>Object.values(s).some(e=>Object.values(e).some(v=>v)));
    if(!hasReps)return;
    localStorage.setItem(`bas_${user}_draft_${wk.id}`,JSON.stringify({sr:sessionReps}));
  },[sessionReps,user,wk.id]);

  function doSave(completeWeek){
    setSaving(true);
    try{
      const curSR=sessionRepsRef.current;
      const skUsed=JSON.parse(JSON.stringify(sessionKg));
      const newSK={...sessionKg};
      // Progresión: solo desde sem 3, solo al techo
      if(wk.num>=3&&rutinas&&split){
        Object.entries(curSR).forEach(([sess,sessData])=>{
          Object.entries(sessData).forEach(([exName,reps])=>{
            const sessExList=(rutinas[split]?.[sess]||[]).flat();
            const exDef=exes.find(e=>e.n===exName)||{hi:12};
            const curKg=sessionKg[exName];if(!curKg||curKg<=0)return;
            const r1=parseInt(reps.r1)||0;
            if(r1>=exDef.hi)newSK[exName]=rKg(curKg*1.05);
          });
        });
      }
      setSessionKg(newSK);
      localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(newSK));
      const d={wi:wk.id,wl:wk.label,sr:curSR,skUsed,sk:newSK,split};
      localStorage.setItem(SK(wk.id,user),JSON.stringify(d));
      const list=JSON.parse(localStorage.getItem(HK(user))||'[]');
      if(!list.includes(wk.id)){list.push(wk.id);localStorage.setItem(HK(user),JSON.stringify(list));}
      setSaved(completeWeek?true:'progreso');loadH();
    }catch(e){}
    setSaving(false);
  }

  function save(){
    if(!canSaveWeek){
      const fmtSat=wkSat.toLocaleDateString('es-AR',{day:'numeric',month:'short'});
      alert(`Todavía no terminó la semana. Guardar semana estará disponible el sáb ${fmtSat}.`);
      return;
    }
    doSave(true);
  }
  function saveProgress(){if(weekLocked)return;doSave(false);}

  function prevWeek(){
    const curNum=parseInt(localStorage.getItem(`bas_${user}_wknum`))||1;
    if(curNum<=1)return;
    const prevNum=curNum-1;
    localStorage.setItem(`bas_${user}_wknum`,String(prevNum));
    setWk(getWkForNum(user,prevNum));
    draftReady.current=false;
    load(prevNum);
    setTimeout(()=>{draftReady.current=true;},100);
  }

  function logout(){if(confirm('¿Cambiar nombre?')){localStorage.removeItem(USER_KEY);setUser(null);setSplit(null);}}

  const login=name=>{
    localStorage.setItem(USER_KEY,name);
    if(!localStorage.getItem(`bas_${name}_startdate`)){
      localStorage.setItem(`bas_${name}_startdate`,new Date().toISOString().split('T')[0]);
    }
    setUser(name);
  };

  const TABS=[{id:'d',l:'Inicio',ic:'🏠'},{id:'t',l:'Entreno',ic:'🏋️'}];

  if(!user)return h(Login,{onLogin:login});
  if(!split)return h(Onboarding,{user,onDone:sp=>{setSplit(sp);}});

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F0EFED',minHeight:'100vh'}},
    // Header
    h('div',{style:{background:'#0A0A0A',padding:'14px 18px',position:'sticky',top:0,zIndex:10,display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',null,
        h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',fontWeight:'700',letterSpacing:'0.12em',textTransform:'uppercase'}},
          'Fuerza T · '+({'3H':'3 días ♂','3M':'3 días ♀','4H':'4 días ♂','4M':'4 días ♀','5H':'5 días ♂','5M':'5 días ♀'}[split]||split)
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('div',{style:{fontSize:'18px',fontWeight:'900',color:'#fff'}},user),
          h('button',{onClick:logout,style:{background:'none',border:'none',cursor:'pointer',fontSize:'10px',color:'rgba(255,255,255,0.25)',padding:0}},'cambiar')
        ),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.4)',marginTop:'1px'}},wk.label)
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px',alignItems:'flex-end',minWidth:'150px'}},
        h('button',{onClick:save,disabled:saving||saved===true||!canSaveWeek,style:{width:'100%',borderRadius:'10px',padding:'10px 14px',fontSize:'12px',fontWeight:'800',cursor:saving||saved===true||!canSaveWeek?'default':'pointer',border:'none',background:saved===true?'#EAF7F2':canSaveWeek?GRAD:'rgba(255,255,255,0.15)',color:saved===true?G:'#fff',letterSpacing:'0.02em',boxShadow:canSaveWeek&&saved!==true?'0 2px 8px rgba(232,84,26,0.35)':'none'}},
          saving?'...':(saved===true?'✓ Semana guardada':canSaveWeek?'Guardar semana':'Nueva sem · disponible el sáb')
        ),
        h('button',{onClick:saveProgress,disabled:saving||weekLocked,style:{width:'100%',borderRadius:'8px',padding:'7px 10px',fontSize:'11px',fontWeight:'600',cursor:saving||weekLocked?'default':'pointer',border:'1.5px solid rgba(255,255,255,0.15)',background:saved==='progreso'?'rgba(55,138,221,0.15)':weekLocked?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.08)',color:saved==='progreso'?B:weekLocked?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},
          saving?'...':(saved==='progreso'?'✓ Progreso guardado':weekLocked?'🔒 Solo lectura':'Guardar progreso')
        ),
        !weekLocked&&saved!==true&&h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',lineHeight:'1.4',paddingTop:'4px',borderTop:'1px solid rgba(255,255,255,0.06)',marginTop:'2px'}},
          '💾 Anotá tus datos y usá Guardar progreso para no perderlos'
        ),
        h('div',{style:{display:'flex',gap:'4px',width:'100%',marginTop:'2px'}},
          h('button',{onClick:prevWeek,disabled:(wk.num||1)<=1,style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',cursor:(wk.num||1)<=1?'default':'pointer',border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',color:(wk.num||1)<=1?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},'← Anterior'),
          h('button',{onClick:()=>{if(split){localStorage.removeItem(`bas_${user}_split`);setSplit(null);}},style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',cursor:'pointer',border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',color:'rgba(255,255,255,0.6)'}},'Split ⚙️')
        )
      )
    ),
    // Content
    h('div',{style:{padding:'14px',paddingBottom:'80px'}},
      loading&&h('div',{style:{...card,textAlign:'center',padding:'32px'}},h('div',{style:{fontSize:'30px',marginBottom:'8px'}},'⏳'),h('div',{style:{fontSize:'14px',color:'#999'}},'Cargando rutinas...')),
      isViewingPast&&h('div',{style:{background:'#0A0A0A',borderRadius:'12px',padding:'12px 14px',marginBottom:'10px',display:'flex',gap:'10px',alignItems:'center'}},
        h('span',{style:{fontSize:'18px'}},'🔒'),
        h('div',null,
          h('div',{style:{fontSize:'12px',fontWeight:'800',color:'#fff',marginBottom:'2px'}},'Semana pasada — solo lectura'),
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.5)'}},'Avanzá a la semana actual para cargar datos')
        )
      ),
      !loading&&tab==='d'&&h(Dashboard,{user,hist,exes,rutinas,split}),
      !loading&&tab==='t'&&h(Training,{user,split,rutinas,exes,wkNum:wk.num,isViewingPast,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,setSaved})
    ),
    // Bottom nav
    h('div',{style:{background:'#0A0A0A',borderTop:'1px solid rgba(255,255,255,0.06)',display:'flex',position:'sticky',bottom:0,zIndex:10}},
      TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:tab===t.id?`2px solid ${AC}`:'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',color:tab===t.id?AC:'rgba(255,255,255,0.35)',fontWeight:tab===t.id?'800':'400',transition:'color 0.2s'}},
        h('span',{style:{fontSize:'18px'}},t.ic),t.l
      ))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
