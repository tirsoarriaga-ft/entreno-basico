// VIDEO QUEUE — IndexedDB is only a temporary retry buffer, never the system source of truth.
const VIDEO_DB='fuerzat_video_queue_v1', VIDEO_STORE='queue';
function videoDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB no disponible'));const req=indexedDB.open(VIDEO_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(VIDEO_STORE))db.createObjectStore(VIDEO_STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir almacenamiento temporal'));});}
async function videoQueuePut(rec){const db=await videoDb();return new Promise((resolve,reject)=>{const tx=db.transaction(VIDEO_STORE,'readwrite');tx.objectStore(VIDEO_STORE).put(rec);tx.oncomplete=()=>resolve(rec);tx.onerror=()=>reject(tx.error);});}
async function videoQueueDel(id){try{const db=await videoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(VIDEO_STORE,'readwrite');tx.objectStore(VIDEO_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}catch(e){}}
async function videoQueueList(user){try{const db=await videoDb();return await new Promise((resolve,reject)=>{const tx=db.transaction(VIDEO_STORE,'readonly');const req=tx.objectStore(VIDEO_STORE).getAll();req.onsuccess=()=>resolve((req.result||[]).filter(x=>x.user===user));req.onerror=()=>reject(req.error);});}catch(e){return[];}}

// Construye el array de comidas desde la fila de Dietas + food DB
function parseDietas(row,foodDB){
  const MEALS=[
    {id:'desayuno',nom:'Desayuno',ic:'☀️',cols:['DesayunoA','DesayunoB','DesayunoC']},
    {id:'almuerzo',nom:'Almuerzo',ic:'🌞',cols:['AlmuerzoA','AlmuerzoB','AlmuerzoC']},
    {id:'merienda',nom:'Merienda',ic:'☕',cols:['MeriendaA','MeriendaB','MeriendaC']},
    {id:'cena',nom:'Cena',ic:'🌙',cols:['CenaA','CenaB','CenaC']},
    {id:'postentreno',nom:'Post-Entreno',ic:'💪',cols:['PostEntrenoA','PostEntrenoB','PostEntrenoC']},
  ];
  const OPT=['A','B','C'];
  return MEALS.map(meal=>{
    const ops=meal.cols.map((col,i)=>{
      const val=String(row[col]||'').trim();if(!val)return null;
      const items=val.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).map(k=>{
        const food=foodDB[k];if(!food)return null;
        return{...food,key:k};
      }).filter(Boolean);
      if(!items.length)return null;
      return{id:OPT[i],nom:'Opción '+OPT[i],items};
    }).filter(Boolean);
    if(!ops.length)return null;
    return{...meal,ops};
  }).filter(Boolean);
}

// Semana secuencial basada en contador localStorage — Lun a Dom
function getWkForNum(user,num){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  const diffToMon=day===0?-6:1-day;
  startMon.setDate(startMon.getDate()+diffToMon);
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label,mon:wkMon,sun:wkSun};
}
// Calcula la semana real según el calendario hoy
function getRealWkNum(user){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const today=new Date();today.setHours(12,0,0,0);
  const diffMs=today-startMon;
  if(diffMs<0)return 1;
  return Math.floor(diffMs/(7*24*60*60*1000))+1;
}
// Devuelve el sábado (fin de semana) de una semana dada
function getWkSat(user,num){
  const wk=getWkForNum(user,num);
  const sat=new Date(wk.mon);sat.setDate(wk.mon.getDate()+5);sat.setHours(23,59,59,999);
  return sat;
}

// ── CHARTS ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=140,labels,pointLabels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:pointLabels?22:10,b:24,l:pointLabels?10:32,r:10};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block',overflow:'visible'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    pointLabels&&pointLabels.map((pl,i)=>(i%step===0||i===data.length-1)?h('text',{key:'pl'+i,x:x(i),y:y(data[i])-8,textAnchor:'middle',fontSize:'9',fontWeight:'700',fill:color},pl):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-6,textAnchor:'middle',fontSize:'9',fill:'#999'},l):null),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mn.toFixed(1)),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mx.toFixed(1))
  );
}
function DualBarChart({data,key2='toxics',color2=R}){
  if(!data||data.length<1)return null;
  const W=300,H=100,pad={t:8,b:22,l:20,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const bW=Math.min(10,iW/data.length/2-2);
  const gap=iW/data.length;
  const max2=Math.max(...data.map(d=>d[key2]||0),1);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('line',{x1:pad.l,y1:pad.t+iH,x2:W-pad.r,y2:pad.t+iH,stroke:'rgba(0,0,0,0.08)',strokeWidth:'1'}),
    data.map((d,i)=>{
      const cx=pad.l+i*gap+gap/2;
      const sH=(d.sleep/7)*iH;
      const v2=d[key2]||0;
      const tH=(v2/max2)*iH;
      return h('g',{key:i},
        h('rect',{x:cx-bW-1,y:pad.t+iH-sH,width:bW,height:Math.max(sH,1),fill:'#111',rx:'2'}),
        h('rect',{x:cx+1,y:pad.t+iH-tH,width:bW,height:Math.max(tH,1),fill:color2,rx:'2'}),
        h('text',{x:cx,y:H-6,textAnchor:'middle',fontSize:'8',fill:'#999'},d.label)
      );
    })
  );
}

                   bk.indexOf(p+'draft_sem_')===0||
                   bk.indexOf(p+'baseProto_sem_')===0||
                   bk.indexOf(p+'rmTest_')===0||
                   bk.indexOf(p+'rmRef_')===0||
                   bk.indexOf(p+'rmRefFinal_')===0;
          });
        if(isBackupContainer)backups.push(parsed);
        else current[k]=v;
      }
    }catch(e){}
    return{current:current,backups:backups};
  }

  function buildPlan(){
    var u=nombre.trim(); if(!u){setMsg('Escribí el nombre exacto del asesorado.');return;}
    var p=pfx(u), maps=stableMaps(), srcs=collectSources(u);
    var hist=parse(srcs.current[p+'hist']||'[]',[]);
    var weekIds={};
    hist.forEach(function(x){weekIds[String(x)]=true;});
    Object.keys(srcs.current).forEach(function(k){
      var m=k.match(new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(sem_\\d+)$'));
      if(m)weekIds[m[1]]=true;
      var d=k.match(/_draft_(sem_\d+)$/); if(d)weekIds[d[1]]=true;
    });
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).forEach(function(k){
        var m=k.match(/(sem_\d+)$/); if(m)weekIds[m[1]]=true;
      });
    });

    var changes=[], counter={n:0,items:[]};
    Object.keys(weekIds).filter(function(wid){return /^sem_\d+$/.test(wid);}).sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));}).forEach(function(wid){
      var savedKey=p+wid, draftKey=p+'draft_'+wid;
      var target=parse(srcs.current[savedKey]||'null',null);
      var draft=parse(srcs.current[draftKey]||'null',null);
      var base=target||{};
      if(draft)base=mergeMissingWeek(base,draft,maps,counter,wid);
      srcs.backups.forEach(function(b){
        var sw=parse(b[savedKey]||'null',null), dw=parse(b[draftKey]||'null',null);
        if(sw)base=mergeMissingWeek(base,sw,maps,counter,wid);
        if(dw)base=mergeMissingWeek(base,dw,maps,counter,wid);
      });
      if(counter.n>0||target||draft){
        changes.push({wid:wid,key:savedKey,data:base,draftKey:draftKey,draft:draft});
      }
    });

    // Base: recuperar respuestas Cumplí/No cumplí faltantes desde backups, sin sobrescribir.
    var protoChanges=[];
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).filter(function(k){return k.indexOf(p+'baseProto_sem_')===0;}).forEach(function(k){
        var old=parse(b[k]||'{}',{}), cur=parse(get(k)||'{}',{});
        var changed=false;
        Object.keys(old||{}).forEach(function(id){
          var v=old[id]; if((v==='si'||v==='no')&&!cur[id]){cur[id]=v;changed=true;counter.n++;counter.items.push({wid:(k.match(/sem_\d+/)||['sem_?'])[0],sess:'',name:'protocolo '+id,field:'Base',value:v});}
        });
        if(changed)protoChanges.push({key:k,data:cur});
      });
    });

    // Fuerza: recuperar referencias/test sólo si la clave completa falta. Nunca toca sessKg.
    var forceKeys={};
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).forEach(function(k){
        if(k.indexOf(p+'rmRef_')===0||k.indexOf(p+'rmRefFinal_')===0||k.indexOf(p+'rmTest_')===0){
          if(!get(k)&&b[k])forceKeys[k]=b[k];
        }
      });
    });
    Object.keys(forceKeys).forEach(function(k){counter.n++;counter.items.push({wid:(k.match(/sem_\d+/)||['sem_?'])[0],sess:'',name:'referencia Fuerza',field:'Fuerza',value:'recuperable'});});

    var realChanges=changes.filter(function(c){
      var before=get(c.key)||''; return JSON.stringify(parse(before,null))!==JSON.stringify(c.data);
    });
    var orderedItems=counter.items.slice().sort(function(a,b){
      function pri(x){return (x.field==='skUsed'||x.field==='sk')?0:1;}
      return pri(a)-pri(b);
    });
    var result={user:u,weeks:realChanges,proto:protoChanges,force:forceKeys,count:counter.n,items:orderedItems};
    var weekSet={}; orderedItems.forEach(function(x){if(/^sem_\d+$/.test(String(x.wid||'')))weekSet[x.wid]=true;});
    var availableWeeks=Object.keys(weekSet).sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));});
    result.availableWeeks=availableWeeks;
    setSelectedRecoveryWeek(availableWeeks.indexOf('sem_15')>=0?'sem_15':'all');
    setPlan(result);
    setMsg(result.count?'Encontré '+result.count+' dato(s) local(es) faltante(s) que pueden recuperarse.':'No encontré datos locales faltantes para recuperar.');
  }

  function recoveryItems(){
    if(!plan)return [];
    return (plan.items||[]).filter(function(x){return selectedRecoveryWeek==='all'||x.wid===selectedRecoveryWeek;});
  }
  function recoveryCount(){return recoveryItems().length;}

  function applyRecovery(){
    if(!plan||!plan.count)return;
    var chosen=selectedRecoveryWeek;
    var chosenCount=recoveryCount();
    if(!chosenCount){setMsg('No hay datos faltantes para ese filtro.');return;}
    var label=chosen==='all'?'todas las semanas':chosen.replace('sem_','S');
    if(!window.confirm('Vas a recuperar '+chosenCount+' dato(s) de '+label+'. Sólo se completarán vacíos: no se reemplazará ningún valor visible, no se tocará sessKg y no se ejecutarán progresiones. ¿Continuar?'))return;
    var p=pfx(plan.user);
    var weeks=plan.weeks.filter(function(x){return chosen==='all'||x.wid===chosen;});
    var proto=plan.proto.filter(function(x){return chosen==='all'||x.key.indexOf(chosen)>=0;});
    var force={}; Object.keys(plan.force||{}).forEach(function(k){if(chosen==='all'||k.indexOf(chosen)>=0)force[k]=plan.force[k];});
    // Backup de seguridad de las claves que sí vamos a tocar.
    var safety={};
    weeks.forEach(function(x){safety[x.key]=get(x.key);safety[x.draftKey]=get(x.draftKey);});
    proto.forEach(function(x){safety[x.key]=get(x.key);});
    Object.keys(force).forEach(function(k){safety[k]=get(k);});
    put(p+'recoverybackup_'+Date.now(),JSON.stringify(safety));

    var hist=parse(get(p+'hist')||'[]',[]);
    weeks.forEach(function(x){
      put(x.key,JSON.stringify(x.data));
      if(!hist.includes(x.wid))hist.push(x.wid);
      var dr=parse(get(x.draftKey)||'null',null);
      if(dr){
        dr.sr=x.data.sr||dr.sr||{};
        dr.sk=x.data.sk||dr.sk||{};
        dr.skUsed=x.data.skUsed||dr.skUsed||{};
        put(x.draftKey,JSON.stringify(dr));
      }
    });
    hist.sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));});
    put(p+'hist',JSON.stringify(hist));
    proto.forEach(function(x){put(x.key,JSON.stringify(x.data));});
    Object.keys(force).forEach(function(k){put(k,force[k]);});
    setMsg('✅ Recuperación terminada: '+chosenCount+' dato(s) de '+label+'. Recargá la app y verificá. Después podés volver a Revisar para recuperar el resto.');
    setPlan(null);
  }


  // T2/T6 reparación de corrimiento semanal legacy: algunas ejecuciones pudieron
  // guardarse bajo la semana anterior cuando el reloj semanal estaba desfasado.
  // Esta herramienta NO mueve nada automáticamente: primero muestra copias locales
  // fechadas y permite copiar sólo A/B faltantes hacia S15 bajo confirmación explícita.
  function flattenExecWeek(obj,maps){
    var out={}; if(!obj)return out;
    ['sr','skUsed','sk'].forEach(function(field){
      var src=obj[field]||{};
      ['A','B'].forEach(function(sess){
        var sm=src[sess]||{};
        Object.keys(sm).forEach(function(oldId){
          var id=mapId(oldId,obj,maps), name=maps.byId[id]||String(id);
          if(field==='sr'){
            Object.keys(sm[oldId]||{}).forEach(function(rk){
              var v=sm[oldId][rk];
              if(v!==undefined&&v!==null&&v!=='')out[sess+'|'+id+'|'+rk]={sess:sess,id:id,name:name,field:rk,value:v};
            });
          }else{
            var v=sm[oldId];
            if(v!==undefined&&v!==null&&v!=='')out[sess+'|'+id+'|'+field]={sess:sess,id:id,name:name,field:field,value:v};
          }
        });
      });
    });
    return out;
  }

  function scanShiftCandidates(){
    var u=nombre.trim(); if(!u){setMsg('Escribí el nombre exacto del asesorado.');return;}
    var p=pfx(u), maps=stableMaps(), rows=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i); if(!k||k.indexOf(p)!==0)continue;
        var parsed=parse(localStorage.getItem(k),null);
        if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))continue;
        var savedKey=p+'sem_14', draftKey=p+'draft_sem_14';
        if(parsed[savedKey]===undefined&&parsed[draftKey]===undefined)continue;
        var sw=parse(parsed[savedKey]||'null',null), dw=parse(parsed[draftKey]||'null',null);
        var merged=mergeMissingWeek(sw||{},dw||{},maps,{n:0,items:[]},'sem_14');
        var flat=flattenExecWeek(merged,maps);
        var m=String(k).match(/_(\d{12,})$/); var ts=m?parseInt(m[1]):0;
        rows.push({key:k,ts:ts,flat:flat,data:merged,count:Object.keys(flat).length});
      }
    }catch(e){}
    rows.sort(function(a,b){return b.ts-a.ts;});
    // deduplicar copias idénticas para no mostrar 20 snapshots iguales
    var seen={}, uniq=[];
    rows.forEach(function(r){var sig=JSON.stringify(r.flat);if(!seen[sig]){seen[sig]=1;uniq.push(r);}});
    setShiftCandidates(uniq);
    setMsg(uniq.length?'Encontré '+uniq.length+' copia(s) distintas de ejecución A/B almacenadas como S14. Revisá fecha y valores antes de copiar.':'No encontré copias S14 distintas para analizar.');
  }

  function migrateShiftCandidate(c){
    if(!c)return;
    var u=nombre.trim(), p=pfx(u), to='sem_15', maps=stableMaps();
    var targetKey=p+to, draftKey=p+'draft_'+to;
    var target=parse(get(targetKey)||'{}',{}), dr=parse(get(draftKey)||'{}',{});
    target.sr=target.sr||{};target.skUsed=target.skUsed||{};target.sk=target.sk||{};
    dr.sr=dr.sr||{};dr.skUsed=dr.skUsed||{};dr.sk=dr.sk||{};
    var sessKg=parse(get(p+'sessKg')||'{}',{}), added=0;
    var items=Object.keys(c.flat||{}).map(function(k){return c.flat[k];});
    if(!window.confirm('Vas a copiar '+items.length+' dato(s) A/B de esta copia S14 hacia S15, sólo donde S15 esté vacío. No se borra S14. ¿Continuar?'))return;
    // backup completo antes de migrar
    var safety={}; safety[targetKey]=get(targetKey); safety[draftKey]=get(draftKey); safety[p+'sessKg']=get(p+'sessKg');
    put(p+'shiftbackup_'+Date.now(),JSON.stringify(safety));
    items.forEach(function(it){
      var sess=it.sess,id=String(it.id),v=it.value;
      if(it.field==='skUsed'||it.field==='sk'){
        target[it.field][sess]=target[it.field][sess]||{};
        dr[it.field][sess]=dr[it.field][sess]||{};
        var cur=target[it.field][sess][id];
        if(cur===undefined||cur===null||cur===''){
          target[it.field][sess][id]=v;dr[it.field][sess][id]=v;added++;
          // recuperación explícita: rehidratar sessKg actual únicamente con el kg
          // realmente recuperado para que vuelva a verse en la semana actual.
          if(it.field==='skUsed'&&(sessKg[sess]?.[id]===undefined||sessKg[sess]?.[id]===null||sessKg[sess]?.[id]==='')){
            sessKg[sess]=sessKg[sess]||{};sessKg[sess][id]=v;
          }
        }
      }else{
        target.sr[sess]=target.sr[sess]||{};target.sr[sess][id]=target.sr[sess][id]||{};
        dr.sr[sess]=dr.sr[sess]||{};dr.sr[sess][id]=dr.sr[sess][id]||{};
        var cur2=target.sr[sess][id][it.field];
        if(cur2===undefined||cur2===null||cur2===''){
          target.sr[sess][id][it.field]=v;dr.sr[sess][id][it.field]=v;added++;
        }
      }
    });
    target.wi=target.wi||to; dr.wi=dr.wi||to;
    put(targetKey,JSON.stringify(target));put(draftKey,JSON.stringify(dr));put(p+'sessKg',JSON.stringify(sessKg));
    var hist=parse(get(p+'hist')||'[]',[]);if(!hist.includes(to)){hist.push(to);hist.sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));});put(p+'hist',JSON.stringify(hist));}
    setMsg('✅ Copié '+added+' dato(s) faltantes hacia S15. Volvé a la app, refrescá y verificá A/B antes de recuperar el resto.');
  }

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#0A0A0A',minHeight:'100vh',padding:'24px',overflowY:'auto'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'24px'}},
      h('button',{onClick:onClose,style:{background:'none',border:'none',fontSize:'22px',cursor:'pointer',color:'#fff'}},'←'),
      h('div',null,
        h('div',{style:{fontSize:'18px',fontWeight:'800',color:'#fff'}},'Recuperar datos'),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.45)',marginTop:'2px'}},'Herramienta de reparación local · no modifica la planificación')
      )
    ),
    !auth
      ?h('div',null,
        h('div',{style:tag},'PIN del coach'),
        h('input',{type:'password',value:pin,onChange:function(e){setPin(e.target.value);},style:Object.assign({},dark,{marginBottom:'12px'})}),
        h('button',{onClick:function(){pin===COACH_PIN?setAuth(true):setMsg('PIN incorrecto');},style:{width:'100%',background:GRAD,color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontSize:'15px',fontWeight:'700',cursor:'pointer'}},'Ingresar'),
        msg&&h('div',{style:{color:'#FCA5A5',marginTop:'8px',fontSize:'13px'}},msg)
      )
      :h('div',null,
        h('div',{style:box},
          h('div',{style:tag},'Asesorado'),
          h('input',{value:nombre,onChange:function(e){setNombre(e.target.value);setPlan(null);setMsg('');},placeholder:'Nombre exacto de ingreso',style:Object.assign({},dark,{marginBottom:'10px'})}),
          h('button',{onClick:buildPlan,style:{width:'100%',background:AC,color:'#fff',border:'none',borderRadius:'10px',padding:'13px',fontSize:'14px',fontWeight:'800',cursor:'pointer'}},'🔎 Revisar datos recuperables')
        ),
        msg&&h('div',{style:{...box,fontSize:'12px',lineHeight:'1.5',color:msg.indexOf('✅')===0?'#86EFAC':'rgba(255,255,255,0.75)'}},msg),
        plan&&plan.count>0&&h('div',{style:box},
          h('div',{style:tag},'Vista previa'),
          h('div',{style:{fontSize:'12px',color:'#fff',fontWeight:'700',marginBottom:'8px'}},plan.count+' dato(s) faltante(s) en total'),
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.5)',marginBottom:'7px'}},'Elegí qué semana recuperar primero:'),
          h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}},
            (plan.availableWeeks||[]).map(function(w){
              var active=selectedRecoveryWeek===w;
              var c=(plan.items||[]).filter(function(x){return x.wid===w;}).length;
              return h('button',{key:w,onClick:function(){setSelectedRecoveryWeek(w);},style:{background:active?AC:'rgba(255,255,255,0.08)',color:'#fff',border:'1px solid '+(active?AC:'rgba(255,255,255,0.12)'),borderRadius:'8px',padding:'7px 9px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}},w.replace('sem_','S')+' · '+c);
            }),
            h('button',{onClick:function(){setSelectedRecoveryWeek('all');},style:{background:selectedRecoveryWeek==='all'?AC:'rgba(255,255,255,0.08)',color:'#fff',border:'1px solid '+(selectedRecoveryWeek==='all'?AC:'rgba(255,255,255,0.12)'),borderRadius:'8px',padding:'7px 9px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}},'Todas · '+plan.count)
          ),
          h('div',{style:{fontSize:'12px',color:'#86EFAC',fontWeight:'800',marginBottom:'8px'}},(selectedRecoveryWeek==='all'?'Todas las semanas':selectedRecoveryWeek.replace('sem_','S'))+' · '+recoveryCount()+' dato(s)'),
          recoveryItems().map(function(x,i){
            var sem=String(x.wid||'').replace('sem_','S');
            var val=(x.value===undefined||x.value===null||x.value==='')?'':(' = '+x.value);
            return h('div',{key:i,style:{fontSize:'11px',color:'rgba(255,255,255,0.6)',padding:'4px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}},
              sem+' · '+(x.sess?x.sess+' · ':'')+x.name+' · '+x.field+val
            );
          }),
          h('div',{style:{fontSize:'11px',color:'#FCD34D',lineHeight:'1.5',marginTop:'10px'}},'Sólo completa vacíos. No pisa datos existentes, no toca sessKg y no ejecuta progresiones.'),
          h('button',{onClick:applyRecovery,style:{width:'100%',background:'#1D9E75',color:'#fff',border:'none',borderRadius:'10px',padding:'13px',fontSize:'14px',fontWeight:'800',cursor:'pointer',marginTop:'12px'}},'♻️ Recuperar '+recoveryCount()+' dato(s) de '+(selectedRecoveryWeek==='all'?'todas':selectedRecoveryWeek.replace('sem_','S')))
        ),
        h('div',{style:{...box,marginTop:'12px'}},
          h('div',{style:tag},'Diagnóstico de semana corrida'),
          h('div',{style:{fontSize:'12px',color:'rgba(255,255,255,0.7)',lineHeight:'1.5',marginBottom:'10px'}},'Si lunes/martes se guardaron cuando el reloj todavía marcaba S14, buscá copias locales fechadas y revisá A/B antes de copiar sólo los faltantes a S15.'),
          h('button',{onClick:scanShiftCandidates,style:{width:'100%',background:'rgba(255,255,255,0.1)',color:'#fff',border:'1px solid rgba(255,255,255,0.15)',borderRadius:'10px',padding:'12px',fontSize:'13px',fontWeight:'800',cursor:'pointer'}},'🧭 Buscar A/B guardados como S14'),
          shiftCandidates.map(function(c,idx){
            var dt=c.ts?new Date(c.ts).toLocaleString('es-AR'):'fecha no disponible';
            var vals=Object.keys(c.flat||{}).map(function(k){return c.flat[k];});
            return h('div',{key:c.key||idx,style:{marginTop:'10px',padding:'10px',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'9px'}},
              h('div',{style:{fontSize:'11px',fontWeight:'800',color:'#86EFAC',marginBottom:'6px'}},dt+' · '+vals.length+' dato(s) A/B'),
              vals.map(function(it,i){return h('div',{key:i,style:{fontSize:'10px',color:'rgba(255,255,255,0.6)',padding:'3px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}},'S14 · '+it.sess+' · '+it.name+' · '+it.field+' = '+it.value);}),
              h('button',{onClick:function(){migrateShiftCandidate(c);},style:{width:'100%',background:'#2563EB',color:'#fff',border:'none',borderRadius:'8px',padding:'10px',fontSize:'12px',fontWeight:'800',cursor:'pointer',marginTop:'8px'}},'Copiar faltantes de esta copia → S15')
            );
          })
        )
      )
  );

function Training({exes,setExes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,persistedExecKg,hist,wk,loadingExes,isViewingPast,isViewingFuture,realWkNum,onReloadHist}){
  // T3: el pasado se renderiza SOLO desde el snapshot de ESA semana.
  var _historicalSnapshotMissing=false;
  var _wSnap=null;
  if(isViewingPast&&hist&&wk){
    _wSnap=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;})||null;
    if(_wSnap&&_wSnap.rutina&&_wSnap.rutina.assign){
      cfg=Object.assign({},cfg,{num:_wSnap.rutina.num||0,assign:_wSnap.rutina.assign,bloque:_wSnap.rutina.bloque||'volumen',series:_wSnap.rutina.series||2,bloqueInicio:_wSnap.rutina.bloqueInicio||1});
    }else{
      _historicalSnapshotMissing=true;
      cfg={num:0,assign:{A:[],B:[],C:[],D:[],E:[]},bloque:'volumen',series:2,bloqueInicio:1};
    }
  }
  const BLOQUES={
    volumen:{label:'Volumen',color:'#1D9E75',emoji:'📈',hint:'2-2-3-3-4-4 series efectivas. Registrá kg + reps; al llegar al techo en la primera serie, la próxima exposición sube 5%.'},
    intensidad:{label:'Intensidad',color:'#378ADD',emoji:'🏋️',hint:'1 serie efectiva + técnica de intensificación. Registrá lo que realmente ejecutaste.'},
    fuerza:{label:'Fuerza',color:'#DC2626',emoji:'💪',hint:'Ejercicio 1 por protocolo e1RM; accesorios con progresión por primera serie efectiva.'},
    base:{label:'Base',color:'#F59E0B',emoji:'🌱',hint:'3 series efectivas con reps pautadas. Cumplí → +5% próxima exposición; No cumplí → mantiene.'},
    rehab:{label:'Rehabilitación',color:'#8B5CF6',emoji:'🩺',hint:'3 series efectivas con reps pautadas y registro de cumplimiento. Sin progresión automática.'}
  };
  const bloque=(cfg?.bloque||'volumen').toLowerCase();
  const bloqueInfo=BLOQUES[bloque]||BLOQUES.volumen;
  const bloqueInicio=cfg?.bloqueInicio||1;
  const wkNum=wk?.num||1;
  const weeksInBlock=Math.max(0,wkNum-bloqueInicio);
  const hasProgression=bloque==='volumen'||bloque==='fuerza';
  const hasAutoSeries=bloque==='volumen';
  const seriesBase=Math.min(4,Math.max(2,cfg?.series||2));
  const defCfg={num:3,assign:{A:[],B:[],C:[],D:[]}};
  if(!cfg)cfg=defCfg;
  const [activeSess,setActiveSess]=useState('A');
  const [tut,setTut]=useState(null);
  const [showHistorial,setShowHistorial]=useState(null); // exId
  const [editKg,setEditKg]=useState(null);
  const [kgVal,setKgVal]=useState('');
  const [exEquiv,setExEquiv]=useState(null); // exercise to show equivalents for
  const [swapVerEx,setSwapVerEx]=useState(0);
  const [correcting,setCorrecting]=useState(false); // modo corrección de datos en semana pasada
  const [corrMsg,setCorrMsg]=useState('');
  const [corrEdits,setCorrEdits]=useState({}); // cambios históricos en borrador hasta Guardar corrección
  const [videos,setVideos]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_videos`)||'{}')}catch(e){return{};}});
  const [uploading,setUploading]=useState({}); // key -> {state,msg,queueId}
  const [showCamera,setShowCamera]=useState(null); // {sessId,exId}
  const fileRef=useRef(null);
  const uploadTarget=useRef(null);
  const retryRef=useRef({});

  function getVideoKey(sessId,exId){return sessId+'_'+exId;}
  function getVideo(sessId,exId){return videos[getVideoKey(sessId,exId)];}
  function uploadState(sessId,exId){return uploading[getVideoKey(sessId,exId)]||null;}
  function setUploadState(sessId,exId,state,msg,queueId){const key=getVideoKey(sessId,exId);setUploading(p=>({...p,[key]:{state,msg:msg||'',queueId:queueId||p[key]?.queueId||''}}));}
  function saveVideoUrlLocal(sessId,exId,url){const nv={...videos,[getVideoKey(sessId,exId)]:url};setVideos(nv);localStorage.setItem(`ase_${user}_videos`,JSON.stringify(nv));}
  function removeVideoUrlLocal(sessId,exId){const nv={...videos};delete nv[getVideoKey(sessId,exId)];setVideos(nv);localStorage.setItem(`ase_${user}_videos`,JSON.stringify(nv));}
  async function confirmVideoInSheet(url,asesoradoId,tries=8){for(let i=0;i<tries;i++){try{const rows=await fetchTimeout(SCRIPT_URL+'?action=videos',{cache:'no-store'},12000).then(r=>r.json());const ok=(rows||[]).some(v=>String(v.URL||'')===String(url)&&(asesoradoId?String(v.AsesoradoID||'')===String(asesoradoId):true));if(ok)return true;}catch(e){}await new Promise(r=>setTimeout(r,900));}return false;}
  async function confirmVideoDeleted(url,asesoradoId,tries=8){for(let i=0;i<tries;i++){try{const rows=await fetchTimeout(SCRIPT_URL+'?action=videos',{cache:'no-store'},12000).then(r=>r.json());const exists=(rows||[]).some(v=>String(v.URL||'')===String(url)&&(asesoradoId?String(v.AsesoradoID||'')===String(asesoradoId):true));if(!exists)return true;}catch(e){}await new Promise(r=>setTimeout(r,900));}return false;}
  async function registerVideoSheet(sessId,exId,url,oldUrl){const exName=exes.find(e=>e.id===parseInt(exId))?.n||exId;const asesoradoId=localStorage.getItem(`ase_${user}_asesoradoId`)||'';fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'video',user,asesoradoId,sessId,exId,exName,url,oldUrl:oldUrl||'',fecha:new Date().toISOString()})}).catch(()=>{});return confirmVideoInSheet(url,asesoradoId);}
  async function deleteVideo(sessId,exId){
    const url=getVideo(sessId,exId);if(!url)return;
    if(!window.confirm('¿Eliminar este video de Fuerza T?'))return;
    const asesoradoId=localStorage.getItem(`ase_${user}_asesoradoId`)||'';
    setUploadState(sessId,exId,'deleting','Eliminando…');
    try{
      fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'videoDelete',user,asesoradoId,url})}).catch(()=>{});
      const ok=await confirmVideoDeleted(url,asesoradoId);
      if(!ok)throw new Error('No se pudo confirmar la eliminación.');
      removeVideoUrlLocal(sessId,exId);
      setUploading(p=>{const n={...p};delete n[getVideoKey(sessId,exId)];return n;});
    }catch(e){setUploadState(sessId,exId,'error',String(e&&e.message||'No se pudo eliminar.'));}
  }

  async function uploadQueued(rec){
    const {blob,sessId,exId,id,oldUrl}=rec; const key=getVideoKey(sessId,exId);
    retryRef.current[key]=rec;
    try{
      setUploadState(sessId,exId,'processing','Procesando video…',id);
      if(!blob||!blob.size)throw new Error('El archivo está vacío.');
      // El navegador actual no transcodifica videos de galería de forma fiable en iOS/Android.
      // Evitamos carga infinita: si excede 100 MB se informa explícitamente en lugar de fingir compresión.
      if(blob.size>100*1024*1024)throw new Error('El video supera 100 MB. Recortalo o grabalo desde la app para generar un archivo más liviano.');
      const fd=new FormData();fd.append('file',blob);fd.append('upload_preset',UPLOAD_PRESET);fd.append('public_id',`${user}_${key}_${Date.now()}`);
      setUploadState(sessId,exId,'uploading','Subiendo…',id);
      const res=await fetchTimeout(CLOUD_URL,{method:'POST',body:fd},120000);
      let data={};try{data=await res.json();}catch(e){}
      if(!res.ok||!data.secure_url)throw new Error(data.error?.message||'Cloudinary no confirmó la subida.');
      setUploadState(sessId,exId,'confirming','Confirmando recepción…',id);
      const confirmed=await registerVideoSheet(sessId,exId,data.secure_url,oldUrl);
      if(!confirmed)throw new Error('El video subió, pero todavía no fue confirmado por Fuerza T. Reintentá la confirmación.');
      saveVideoUrlLocal(sessId,exId,data.secure_url);
      await videoQueueDel(id);delete retryRef.current[key];
      setUploadState(sessId,exId,'sent','Video enviado.',id);
      setTimeout(()=>setUploading(p=>{const n={...p};delete n[key];return n;}),1800);
      return true;
    }catch(e){setUploadState(sessId,exId,'error',String(e&&e.message||'No se pudo subir.'),id);return false;}
  }
  async function queueAndUpload(blob,sessId,exId,source){
    const id=`${user}_${sessId}_${exId}_${Date.now()}`;
    const rec={id,user,sessId,exId,source:source||'video',createdAt:Date.now(),oldUrl:getVideo(sessId,exId)||'',blob};
    try{await videoQueuePut(rec);}catch(e){
      // Si no hay IndexedDB, se puede intentar dentro de esta sesión, pero se informa la limitación.
      setUploadState(sessId,exId,'processing','Procesando video…');
    }
    return uploadQueued(rec);
  }
  function retryVideo(sessId,exId){const key=getVideoKey(sessId,exId),st=uploadState(sessId,exId);const rec=retryRef.current[key];if(rec)return uploadQueued(rec);if(st?.queueId){videoQueueList(user).then(xs=>{const q=xs.find(x=>x.id===st.queueId);if(q)uploadQueued(q);});}}

  useEffect(()=>{
    // Recuperar grabaciones/archivos pendientes después de refresh sin subirlos a ciegas.
    videoQueueList(user).then(xs=>{xs.forEach(rec=>{const key=getVideoKey(rec.sessId,rec.exId);retryRef.current[key]=rec;setUploadState(rec.sessId,rec.exId,'error','Video pendiente de envío · Reintentar',rec.id);});});
  },[user]);

  function triggerGallery(sessId,exId){uploadTarget.current={sessId,exId};if(fileRef.current)fileRef.current.click();}
  function onFileChange(e){const file=e.target.files&&e.target.files[0];if(!file||!uploadTarget.current)return;const{sessId,exId}=uploadTarget.current;queueAndUpload(file,sessId,exId,'gallery');e.target.value='';}
  const [cfgSess,setCfgSess]=useState('A');
  const [openTec,setOpenTec]=useState(null);
  const SESS=['A','B','C','D','E'].slice(0,cfg.num);

  const saveCfg=nc=>{setCfg(nc);localStorage.setItem(CFG_KEY(user),JSON.stringify(nc));};
  const toggleEx=(s,id)=>{const cur=cfg.assign[s]||[];const na=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];saveCfg({...cfg,assign:{...cfg.assign,[s]:na}});};
  const setNum=n=>{const na={};['A','B','C','D','E'].slice(0,n).forEach(s=>{na[s]=cfg.assign[s]||[];});saveCfg({...cfg,num:n,assign:na});};

  const getKg=function(ex){
    // En modo Corregir, el valor tipeado manda visualmente aunque todavía no se haya confirmado.
    // Así al salir del input no desaparece: queda como borrador hasta “Guardar corrección”.
    if(isViewingPast&&correcting){
      const ck=String(ex.id)+'|kg';
      if(Object.prototype.hasOwnProperty.call(corrEdits,ck)){
        const cv=parseFloat(corrEdits[ck]);
        if(!isNaN(cv)&&cv>0)return cv;
        return undefined;
      }
    }
    if(isViewingPast){
      // El snapshot persistido de ESA semana es la fuente visual del histórico.
      // Leer localStorage primero evita que, tras Guardar corrección, el render siga
      // mostrando el objeto `hist` anterior hasta cambiar de semana/recargar.
      var thisWkData=null;
      try{thisWkData=JSON.parse(localStorage.getItem('ase_'+user+'_'+wk.id)||'null');}catch(e){}
      if(!thisWkData)thisWkData=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;});
      if(thisWkData){
        var skU=thisWkData.skUsed||thisWkData.sk||{};
        var skSess=skU[activeSess];
        if(skSess){
          var kg=skSess[ex.id]||skSess[String(ex.id)];
          if(kg)return kg;
        }
      }
      return undefined; // en sem pasada NO caer al sessKg de hoy
    }
    const liveKg=sessionKg&&sessionKg[activeSess]?(sessionKg[activeSess][ex.id]||sessionKg[activeSess][String(ex.id)]||undefined):undefined;
    if(liveKg!==undefined&&liveKg!==null&&liveKg!=='')return liveKg;
    // T6: si la carga ejecutada ya fue persistida pero sessKg local se perdió,
    // mostrar skUsed como evidencia histórica de ESTA semana sin escribirla en sessKg.
    const persisted=persistedExecKg&&persistedExecKg[activeSess]?(persistedExecKg[activeSess][ex.id]||persistedExecKg[activeSess][String(ex.id)]||undefined):undefined;
    return persisted;
  };
  const getRep=(sess,exId,k)=>{
    // Buscar con la clave tal cual, como string y como int (post-migración ex.id es int del sheet,
    // pero el draft cargado del JSON trae claves string). Mismo criterio que getKg.
    const ss=sessionReps?.[sess]||{};
    const cell=ss[exId]||ss[String(exId)]||ss[parseInt(exId)]||null;
    const stored=cell?(cell[k]||''):'';
    if(stored)return stored;
    if(bloque==='base'||bloque==='rehab'){const ex=exes.find(e=>e.id==exId);if(ex)return String(Math.round((ex.low+ex.hi)/2));}
    return '';
  };

  const numSeries=(()=>{
    if(bloque==='base'||bloque==='rehab')return 3;
    if(hasAutoSeries)return Math.min(4,seriesBase+Math.floor(weeksInBlock/2));
    return seriesBase;
  })();
  const semanasParaSiguienteSerie=(hasAutoSeries&&numSeries<4)?(2-(weeksInBlock%2)||2):null;
  const SERIES_KEYS=['r1','r2','r3','r4'].slice(0,numSeries);

  // FUERZA: protocolo fijo del ejercicio principal por semana del bloque.
  // FUERZA vigente: S1 test + back-off; S2-3 80%; S4-5 85%; S6 90%; S7 95%; S8 retest.
  const FUERZA_PROTOCOLO=[
    {sems:[2,3],series:3,reps:4,pct:80},
    {sems:[4,5],series:4,reps:3,pct:85},
    {sems:[6],series:5,reps:2,pct:90},
    {sems:[7],series:5,reps:1,pct:95}
  ];
  const semEnBloque=weeksInBlock+1;
  const rolFuerza=(ex)=>{
    const lista=(cfg.assign[activeSess]||[]);
    let pos=-1,count=0;
    for(const item of lista){
      const ids=Array.isArray(item)?item:[item];
      for(const id of ids){if(String(id)===String(ex.id))pos=count;count++;}
    }
    if(pos===0)return 'principal';
    if(pos===1||pos===2)return 'accesorio';
    return 'finalizador';
  };
  const protoActual=()=>FUERZA_PROTOCOLO.find(p=>p.sems.includes(semEnBloque))||null;
  // Fuerza: la referencia pertenece al bloque, no al usuario para siempre.
  const rmRefKey=(ex)=>`ase_${user}_rmRef_b${bloqueInicio}_${activeSess}_${ex.id}`;
  const rmRefLegacyKey=(ex)=>`ase_${user}_rmRef_${activeSess}_${ex.id}`;
  const getRmRef=(ex)=>{if(isViewingPast&&_wSnap?.exec?.forceRefs){const z=parseFloat(_wSnap.exec.forceRefs?.[activeSess]?.[ex.id]||_wSnap.exec.forceRefs?.[activeSess]?.[String(ex.id)]);return isNaN(z)?0:z;}let v=parseFloat(localStorage.getItem(rmRefKey(ex)));if(isNaN(v)&&!isViewingPast){v=parseFloat(localStorage.getItem(rmRefLegacyKey(ex)));if(!isNaN(v))try{localStorage.setItem(rmRefKey(ex),String(v));}catch(e){}}return isNaN(v)?0:v;};
  const rmRefFinalKey=(ex)=>`ase_${user}_rmRefFinal_b${bloqueInicio}_${activeSess}_${ex.id}`;
  const rmRefFinalLegacyKey=(ex)=>`ase_${user}_rmRefFinal_${activeSess}_${ex.id}`;
  const getRmRefFinal=(ex)=>{if(isViewingPast&&_wSnap?.exec?.forceFinalRefs){const z=parseFloat(_wSnap.exec.forceFinalRefs?.[activeSess]?.[ex.id]||_wSnap.exec.forceFinalRefs?.[activeSess]?.[String(ex.id)]);return isNaN(z)?0:z;}let v=parseFloat(localStorage.getItem(rmRefFinalKey(ex)));if(isNaN(v)&&!isViewingPast){v=parseFloat(localStorage.getItem(rmRefFinalLegacyKey(ex)));if(!isNaN(v))try{localStorage.setItem(rmRefFinalKey(ex),String(v));}catch(e){}}return isNaN(v)?0:v;};
  const setRmRef=(ex,val)=>{try{localStorage.setItem(rmRefKey(ex),String(val));}catch(e){}};
  const setRmRefFinal=(ex,val)=>{try{localStorage.setItem(rmRefFinalKey(ex),String(val));}catch(e){}};
  const forceInitialKey=(ex)=>`ase_${user}_forceInitial_b${bloqueInicio}_${activeSess}_${ex.id}`;
  const getForceInitial=(ex)=>{
    if(isViewingPast&&_wSnap?.exec?.forceInitial){const z=_wSnap.exec.forceInitial?.[activeSess]?.[ex.id]||_wSnap.exec.forceInitial?.[activeSess]?.[String(ex.id)];if(z)return z;}
    try{return JSON.parse(localStorage.getItem(forceInitialKey(ex))||'null');}catch(e){return null;}
  };
  const setForceInitial=(ex,obj)=>{try{localStorage.setItem(forceInitialKey(ex),JSON.stringify(obj));}catch(e){}};
  const forceBackoffKey=`ase_${user}_forceBackoff_${wk.id}_${activeSess}`;
  const readForceBackoff=()=>{if(isViewingPast&&_wSnap?.exec?.forceBackoff)return _wSnap.exec.forceBackoff[activeSess]||{};try{return JSON.parse(localStorage.getItem(forceBackoffKey)||'{}')||{};}catch(e){return{};}};
  const [forceBackoff,setForceBackoff]=useState(readForceBackoff);
  useEffect(()=>{setForceBackoff(readForceBackoff());},[activeSess,user,wk.id,isViewingPast]);
  useEffect(()=>{if(!isViewingPast&&!isViewingFuture)try{localStorage.setItem(forceBackoffKey,JSON.stringify(forceBackoff));}catch(e){}},[forceBackoff,forceBackoffKey,isViewingPast,isViewingFuture]);
  const setBackoffReps=(ex,v)=>{setForceBackoff(q=>({...q,[ex.id]:{...(q[ex.id]||{}),reps:v}}));setSaved(false);};
  const epley=(kg,reps)=>Math.round(kg*(1+reps/30));
  const esDia1Fuerza=bloque==='fuerza'&&semEnBloque===1;
  const esRetestFuerza=bloque==='fuerza'&&semEnBloque===8;
  const fuerzaCerrada=bloque==='fuerza'&&semEnBloque>8;
  // Test/retest = ejecución semanal, no estado global de la sesión.
  const rmTestLSKey=`ase_${user}_rmTest_${wk.id}_${activeSess}`;
  const readRmTest=()=>{if(isViewingPast&&_wSnap?.exec?.forceTests)return _wSnap.exec.forceTests[activeSess]||{};try{const scoped=JSON.parse(localStorage.getItem(rmTestLSKey)||'null');if(scoped)return scoped;if(!isViewingPast&&!isViewingFuture){const legacy=JSON.parse(localStorage.getItem(`ase_${user}_rmTest_${activeSess}`)||'null');if(legacy){localStorage.setItem(rmTestLSKey,JSON.stringify(legacy));return legacy;}}}catch(e){}return {};};
  const [rmTest,setRmTest]=useState(readRmTest);
  useEffect(()=>{setRmTest(readRmTest());},[activeSess,user,wk.id,isViewingPast]);
  useEffect(()=>{if(!isViewingPast&&!isViewingFuture)try{localStorage.setItem(rmTestLSKey,JSON.stringify(rmTest));}catch(e){}},[rmTest,rmTestLSKey,isViewingPast,isViewingFuture]);
  const kgPrincipal=(ex)=>{const p=protoActual();if(!p)return 0;const rm=getRmRef(ex);return rm>0?Math.round((rm*p.pct/100)/2.5)*2.5:0;};
  const kgBackoff=(ex)=>{const rm=getRmRef(ex);return rm>0?Math.round((rm*0.70)/2.5)*2.5:0;};
  const seriesKeysEx=(ex)=>{
    if(bloque!=='fuerza')return SERIES_KEYS;
    const rol=rolFuerza(ex);
    const p=protoActual();
    const n=rol==='principal'?(p?p.series:0):(rol==='accesorio'?2:1);
    return ['r1','r2','r3','r4','r5'].slice(0,n);
  };

  // BASE: respuesta del protocolo por ejercicio, persistida por semana + sesión.
  const baseProtoKey=`ase_${user}_baseProto_${wk.id}_${activeSess}`;
  const [baseProto,setBaseProto]=useState(()=>{try{return JSON.parse(localStorage.getItem(baseProtoKey)||'{}');}catch(e){return{};}});
  const baseProtoLoadedKey=useRef(baseProtoKey);
  useEffect(()=>{
    const k=`ase_${user}_baseProto_${wk.id}_${activeSess}`;
    baseProtoLoadedKey.current=k;
    try{setBaseProto(JSON.parse(localStorage.getItem(k)||'{}'));}catch(e){setBaseProto({});}
  },[activeSess,wk.id,user]);
  useEffect(()=>{
    if(baseProtoLoadedKey.current!==baseProtoKey)return;
    try{localStorage.setItem(baseProtoKey,JSON.stringify(baseProto));}catch(e){}
  },[baseProto,baseProtoKey]);

  const getBaseProto=function(exId){
    if(isViewingPast&&correcting){const kp=String(exId)+'|proto';if(Object.prototype.hasOwnProperty.call(corrEdits,kp))return corrEdits[kp]||'';}
    if(isViewingPast&&_wSnap?.exec?.baseProto){const bp=_wSnap.exec.baseProto[activeSess]||{};return bp[exId]||bp[String(exId)]||baseProto[exId]||baseProto[String(exId)]||'';}
    return baseProto[exId]||baseProto[String(exId)]||'';
  };
  const toggleBaseProto=function(exId,val){
    if(isViewingPast){
      if(!correcting)return;
      const kp=String(exId)+'|proto';
      const cur=getBaseProto(exId);
      setCorrEdits(function(x){return Object.assign({},x,{[kp]:cur===val?'':val});});
      return;
    }
    setBaseProto(function(p){return Object.assign({},p,{[exId]:(p[exId]===val?'':val)});});
  };

  const intensityPrescriptionKey=(ex)=>`ase_${user}_intensityPrescription_${activeSess}_${ex.id}`;
  const intensityExecutionKey=(ex)=>`ase_${user}_intensity_${wk.id}_${activeSess}_${ex.id}`;
  const getIntensityPrescription=(ex)=>localStorage.getItem(intensityPrescriptionKey(ex))||'';
  const getIntensityExecution=(ex)=>{
    if(isViewingPast){
      const snap=_wSnap?.exec?.intensity?.[activeSess]||{};
      if(Object.prototype.hasOwnProperty.call(snap,String(ex.id)))return snap[String(ex.id)]||'';
      if(Object.prototype.hasOwnProperty.call(snap,ex.id))return snap[ex.id]||'';
      const ownPast=localStorage.getItem(intensityExecutionKey(ex));
      return ownPast===null?'':ownPast; // jamás caer a la prescripción actual al mirar pasado
    }
    const own=localStorage.getItem(intensityExecutionKey(ex));
    if(own!==null)return own;
    return getIntensityPrescription(ex);
  };
  const setIntensityTechnique=(ex,val)=>{
    const cur=getIntensityExecution(ex);
    const next=cur===val?'':val;
    localStorage.setItem(intensityExecutionKey(ex),next);
    // Una selección positiva actualiza la prescripción futura. Desmarcar sólo afecta esta exposición.
    if(next)localStorage.setItem(intensityPrescriptionKey(ex),next);
    setSaved(false);
    setOpenTec(x=>x===ex.id?null:ex.id);
  };

  const prevBestSet=(ex)=>{
    if(!hist||hist.length===0)return null;
    const prevs=hist
      .map(function(w){return{w:w,num:parseInt(String(w.wi||'').replace('sem_',''))||0};})
      .filter(function(x){return x.num>0&&x.num<(wk.num||1);})
      .sort(function(a,b){return b.num-a.num;});

function foodTotals(foods,grams){
  let kcal=0,p=0,c=0,g=0,fib=0;
  foods.forEach((f,i)=>{const x=(grams[i]||0)/100;kcal+=(f.kcal100||0)*x;p+=(f.p100||0)*x;c+=(f.c100||0)*x;g+=(f.g100||0)*x;fib+=(f.fibra100||0)*x;});

}
function inferPortionGroup(f){

  const has=(xs)=>xs.some(x=>k.includes(x)||n.includes(x));
  if(has(['clara']))return'claras';
  if(has(['huevo']))return'huevo';
  if(has(['yogur','cottage','ricota']))return'lacteo_semisolido';
  if(has(['leche']))return'lacteo_liquido';
  if(has(['whey','prote','suero']))return'proteina_polvo';
  if(has(['pollo','carne','ternera','lomo','cerdo','merluza','salmon','salmón','pescado','milanesa','atun','atún','muslo']))return'carne_pescado';
  if(has(['lentej','garbanz','poroto']))return'legumbre';
  if(has(['aceite']))return'grasa_concentrada';
  if(has(['almendra','nuez','mani','maní','semilla','oliva','palta']))return'grasa_solida';
  if(f.cat==='FV'||String(f.cat).toUpperCase()==='FV')return has(['ensalada','verdura','lechuga','tomate','zanah','berenjena','zapall','brocoli','brócoli','espinaca','acelga'])?'verdura':'fruta';
  if(has(['arroz','pasta','fideo','ñoqui','polenta','papa','batata','choclo','quinoa']))return'carbo_plato';
  if(has(['pan','tortilla','taco','tapita','galleta','tostada']))return'carbo_unidad';
  if(has(['avena','granola','cereal','harina','miel','mermelada','dulce']))return'carbo_concentrado';

}
function rangeVals(a,b,step){const out=[];for(let x=a;x<=b+0.001;x+=step)out.push(Math.round(x*10)/10);return out;}
function visualVals(f,minQ,maxQ,stepQ){

function portionCandidates(f){

  else if(g==='lacteo_liquido')xs=rangeVals(120,360,30);
  else if(g==='proteina_polvo')xs=visualVals(f,.5,1.5,.5);
  else if(g==='carne_pescado')xs=rangeVals(100,250,25);
  else if(g==='legumbre')xs=rangeVals(80,250,25);
  else if(g==='carbo_plato')xs=rangeVals(100,300,25);
  else if(g==='carbo_unidad')xs=visualVals(f,1,4,1);
  else if(g==='carbo_concentrado')xs=rangeVals(10,80,10);
  else if(g==='grasa_concentrada')xs=rangeVals(5,20,5);
  else if(g==='grasa_solida')xs=rangeVals(10,30,5);
  else if(g==='fruta')xs=visualVals(f,.5,2,.5);
  else if(g==='verdura')xs=rangeVals(100,400,50);

function practicalPenalty(f,g){

function dayStatus(day,daily){

    gLow:Math.max(0,daily.gMin-day.g),
    fibLow:Math.max(0,daily.fib*.85-day.fib)

}
function dayProblemScore(day,daily){

      portionCandidates(f).forEach(ng=>{
        if(ng===old)return;
        const delta=ng-old;
        // Dirección coherente con el problema diario dominante.
        if(st.kcalLow>0&&delta<0)return;
        if(st.kcalHigh>0&&delta>0)return;
        if(st.pLow>0&&delta<0&&f.p100>0)return;
        if(st.gLow>0&&delta<0&&f.g100>0)return;

}

  const [err,setErr]=useState('');
  const [preview,setPreview]=useState(null); // {blob,url}
  const videoRef=useRef(null),streamRef=useRef(null),mrRef=useRef(null),chunksRef=useRef([]),timerRef=useRef(null);

  function attachStream(stream){
    streamRef.current=stream;
    if(videoRef.current){videoRef.current.removeAttribute('src');videoRef.current.srcObject=stream;videoRef.current.muted=true;videoRef.current.controls=false;videoRef.current.play().catch(()=>{});}
  }
  function openCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setErr('Este navegador no permite grabar directamente. Usá Galería.');return;}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:720},height:{ideal:1280}},audio:true})
      .then(stream=>{setErr('');attachStream(stream);})
      .catch(()=>setErr('No se pudo abrir la cámara. Revisá permisos o usá Galería.'));
  }
  useEffect(()=>{
    openCamera();
    return()=>{
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
      if(timerRef.current)clearInterval(timerRef.current);
      if(preview&&preview.url)URL.revokeObjectURL(preview.url);
    };
  },[]);
  function startRec(){
    setErr('');chunksRef.current=[];
    if(!streamRef.current||!window.MediaRecorder){setErr('La grabación directa no está disponible en este navegador. Usá Galería.');return;}
    try{
      const mime=recorderMime();
      const opts={videoBitsPerSecond:700000,audioBitsPerSecond:64000};if(mime)opts.mimeType=mime;
      const mr=new MediaRecorder(streamRef.current,opts);
      mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunksRef.current.push(e.data);};
      mr.onerror=()=>setErr('La grabación se interrumpió. Si el archivo quedó disponible podrás reintentar.');
      mr.onstop=()=>{
        const type=(mr.mimeType||mime||'video/webm').split(';')[0];
        const blob=new Blob(chunksRef.current,{type});
        if(blob.size<=0){setErr('No se generó un archivo válido. Intentá nuevamente.');return;}
        const url=URL.createObjectURL(blob);
        setPreview({blob,url});
        if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
        streamRef.current=null;
        setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=null;videoRef.current.src=url;videoRef.current.muted=false;videoRef.current.controls=true;videoRef.current.play().catch(()=>{});}},0);
      };
      mrRef.current=mr;mr.start(1000);setRecording(true);let secs=0;setCountdown(120);
      timerRef.current=setInterval(()=>{secs++;setCountdown(Math.max(0,120-secs));if(secs>=120)stopRec();},1000);
    }catch(e){setErr('Este dispositivo no pudo iniciar la grabación directa. Usá Galería.');}
  }
  function stopRec(){if(mrRef.current&&mrRef.current.state!=='inactive')mrRef.current.stop();if(timerRef.current)clearInterval(timerRef.current);setRecording(false);}
  function recordAgain(){
    if(preview&&preview.url)URL.revokeObjectURL(preview.url);
    setPreview(null);setErr('');
    if(videoRef.current){videoRef.current.pause();videoRef.current.removeAttribute('src');videoRef.current.controls=false;}
    openCamera();
  }
  function useVideo(){if(preview&&preview.blob)onCapture(preview.blob);}
  return h('div',{style:{position:'fixed',inset:0,background:'#000',zIndex:500,display:'flex',flexDirection:'column'}},
    h('video',{ref:videoRef,autoPlay:!preview,muted:!preview,playsInline:true,style:{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}),
    h('div',{style:{position:'absolute',top:'max(14px, env(safe-area-inset-top))',left:'14px',right:'14px',zIndex:2,display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('button',{onClick:recording?()=>{}:onClose,disabled:recording,style:{background:'rgba(0,0,0,.55)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',borderRadius:'9px',padding:'9px 12px',fontWeight:'700'}},recording?'Grabando…':'✕ Cancelar'),
      recording&&h('div',{style:{background:'rgba(0,0,0,.6)',color:'#fff',borderRadius:'20px',padding:'7px 11px',fontWeight:'900'}},'● '+countdown+'s')
    ),
    preview&&h('div',{style:{position:'absolute',top:'70px',left:'14px',right:'14px',zIndex:2,textAlign:'center',color:'#fff',fontSize:'13px',fontWeight:'800',textShadow:'0 1px 4px #000'}},'Revisá el video antes de enviarlo'),
    err&&h('div',{style:{position:'absolute',left:'14px',right:'14px',bottom:'130px',zIndex:3,background:'rgba(127,29,29,.92)',color:'#fff',borderRadius:'10px',padding:'10px 12px',fontSize:'12px',fontWeight:'700',textAlign:'center'}},err),
    h('div',{style:{position:'absolute',left:0,right:0,bottom:0,zIndex:2,padding:'18px 24px calc(18px + env(safe-area-inset-bottom))',background:'linear-gradient(transparent,rgba(0,0,0,.9))',display:'flex',justifyContent:'center',alignItems:'center',gap:'10px',minHeight:'110px'}},
      preview
        ?h('div',{style:{display:'flex',gap:'10px',width:'100%',maxWidth:'460px'}},
            h('button',{onClick:recordAgain,style:{flex:1,background:'rgba(255,255,255,.14)',color:'#fff',border:'1px solid rgba(255,255,255,.45)',borderRadius:'10px',padding:'12px',fontSize:'13px',fontWeight:'800'}},'Volver a grabar'),
            h('button',{onClick:useVideo,style:{flex:1,background:G,color:'#fff',border:'none',borderRadius:'10px',padding:'12px',fontSize:'13px',fontWeight:'900'}},'Usar este video')

    )
  );
}

// ── HELPERS DE BACKUP / MIGRACIÓN ─────────────────────────────────────
function _ftNorm(s){return String(s||'').trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');}
function _ftGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _ftSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// Devuelve el contenido del backup pre-migración más ANTIGUO (el original limpio), como objeto {clave:valor}.
function _ftBackupOriginal(user){
  var p='ase_'+user+'_';
  var keys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p+'migbackup_')===0)keys.push(k);}}catch(e){}
  if(!keys.length)return null;
  // el más antiguo = timestamp menor = estado más limpio (pre primera migración)
  keys.sort(function(a,b){var ta=parseInt(a.split('migbackup_')[1])||0;var tb=parseInt(b.split('migbackup_')[1])||0;return ta-tb;});
  try{return {key:keys[0],data:JSON.parse(_ftGet(keys[0])||'{}')};}catch(e){return null;}
}
// Guarda un backup del estado ACTUAL antes de cualquier operación (por si acaso).
function _ftSnapshot(user,tagPrefix){
  var p='ase_'+user+'_';var snap={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p)===0&&k.indexOf(p+'migbackup_')!==0)snap[k]=localStorage.getItem(k);}}catch(e){}
  _ftSet(p+(tagPrefix||'migbackup')+'_'+Date.now(),JSON.stringify(snap));
}

// ── RESTAURAR desde el backup original (pre-migración) ────────────────
// Repone TODAS las claves del usuario tal como estaban antes de migrar.
function restaurarBackupOriginal(user){
  var p='ase_'+user+'_';
  var bk=_ftBackupOriginal(user);
  if(!bk||!bk.data||Object.keys(bk.data).length===0)return {error:'no hay backup para restaurar'};
  // Snapshot del estado actual antes de pisarlo (por seguridad)
  _ftSnapshot(user,'prerestore');
  var count=0;
  Object.keys(bk.data).forEach(function(k){
    // No reponer los propios backups dentro del backup (no debería haberlos, pero por si acaso)
    if(k.indexOf(p+'migbackup_')===0)return;
    _ftSet(k,bk.data[k]);count++;
  });
  // Al restaurar, quitamos la marca de migrado para poder re-migrar limpio
  try{localStorage.removeItem(p+'migrated_v1');}catch(e){}
  return {ok:true,claves:count,backup:bk.key};
}

// ── MIGRACIÓN A IDs ESTABLES DEL SHEET (v2 — por semana, desde backup) ─
// Traduce sr/skUsed/sk de cada semana usando el snapshot `e` de ESA MISMA
// semana (cada semana tiene su propio orden), tomando SIEMPRE como fuente
// el backup original (nunca datos ya migrados). Idempotente.
function migrarIDsEstables(user,rows,force){
  var p='ase_'+user+'_';
  if(!force&&_ftGet(p+'migrated_v2'))return {skipped:true};
  var nameToId={};
  (rows||[]).forEach(function(r){var id=parseInt(r.ID!==undefined?r.ID:r.id);var nm=_ftNorm(r.Nombre||r.NOMBRE||r.nombre);if(!isNaN(id)&&nm)nameToId[nm]=id;});
  if(Object.keys(nameToId).length===0)return {error:'sin ejercicios del sheet'};
  // FUENTE: backup original si existe (datos limpios); si no, estado actual (solo si no migrado v2).
  var bk=_ftBackupOriginal(user);
  var source=bk?bk.data:null;
  var getRaw=function(k){return source?source[k]:_ftGet(k);};
  // Snapshot del estado actual antes de sobrescribir (por seguridad)
  _ftSnapshot(user,'premig2');
  var histIds=[];try{histIds=JSON.parse(getRaw(p+'hist')||'[]');}catch(e){}
  var unmapped=0, mapped=0;
  histIds.forEach(function(semId){
    var raw=getRaw(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w.e||!w.e.length)return; // sin snapshot no se puede traducir: dejar como está
    // diccionario de ESTA semana: id_viejo -> nombre
    var oldToName={};
    w.e.forEach(function(ex){if(ex&&ex.id!==undefined&&ex.n)oldToName[String(ex.id)]=_ftNorm(ex.n);});
    var remap=function(obj){
      if(!obj)return obj;
      var out={};
      Object.keys(obj).forEach(function(sess){
        out[sess]={};
        Object.keys(obj[sess]||{}).forEach(function(oldId){
          var nm=oldToName[String(oldId)];
          var nid=nm?nameToId[nm]:undefined;
          if(nid!==undefined){out[sess][nid]=obj[sess][oldId];mapped++;}
          else{out[sess][oldId]=obj[sess][oldId];unmapped++;} // preservar huérfano tal cual
        });
      });
      return out;
    };
    w.sr=remap(w.sr);
    w.skUsed=remap(w.skUsed);
    w.sk=remap(w.sk);
    // e nuevo con ids del sheet (para que la app lo lea coherente)
    w.e=w.e.map(function(ex){var nid=ex&&ex.n?nameToId[_ftNorm(ex.n)]:undefined;return Object.assign({},ex,{id:nid!==undefined?nid:ex.id});});
    w._migrated2=true;
    _ftSet(p+semId,JSON.stringify(w));
    // MIGRAR TAMBIÉN EL DRAFT de esta semana: la app lee el draft primero al abrir.
    // El draft no tiene su propio `e`, así que se traduce con el oldToName de ESTA semana.
    var draftKey=p+'draft_'+semId;
    var draftRaw=getRaw(draftKey);
    if(draftRaw){
      try{
        var dr=JSON.parse(draftRaw);
        if(dr&&dr.sr)dr.sr=remap(dr.sr);
        dr._migrated2=true;
        _ftSet(draftKey,JSON.stringify(dr));
      }catch(e){}
    }
  });
  // Asegurar que hist esté repuesto (viene del backup)
  var histRaw=getRaw(p+'hist');if(histRaw)_ftSet(p+'hist',histRaw);
  // Reconstruir sessKg vivo desde las semanas ya migradas (más nueva -> más vieja)
  var newSessKg={};
  histIds.slice().reverse().forEach(function(semId){
    var raw=_ftGet(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w._migrated2)return;
    var src=w.skUsed||w.sk||{};
    Object.keys(src).forEach(function(sess){
      if(!newSessKg[sess])newSessKg[sess]={};
      Object.keys(src[sess]||{}).forEach(function(exId){
        if(newSessKg[sess][exId]===undefined){var v=src[sess][exId];if(v&&parseFloat(v)>0)newSessKg[sess][exId]=v;}
      });
    });
  });
  _ftSet(p+'sessKg',JSON.stringify(newSessKg));
  _ftSet(p+'migrated_v2','1');
  return {ok:true,semanas:histIds.length,mapped:mapped,unmapped:unmapped,fuente:bk?'backup':'actual'};
}

  const [persistedExecKg,setPersistedExecKg]=useState({});

    const storedNum=parseInt(localStorage.getItem(`ase_${user}_wknum`))||1;
    // Si storedNum > realNum → corregir al real (no puede estar en el futuro)
    // Si storedNum < realNum → respetar (puede estar viendo una sem pasada)
    // Además guardar realNum como máximo para que "Nueva →" no supere el calendario
    localStorage.setItem(`ase_${user}_maxWkNum`,String(realNum));

      localStorage.setItem(`ase_${user}_wknum`,String(correctedNum));
    }
    // Si nunca avanzó (storedNum=1 pero realNum>1) → ir a realNum automáticamente

    // antes de restaurar. Esto evita que el auto-save reviva datos de la semana anterior.
    if(wkNum>storedNum){
      const nuevoId='sem_'+wkNum;
      localStorage.removeItem(`ase_${user}_draft_sem_${wkNum}`);
      localStorage.removeItem(`ase_${user}_draft_${nuevoId}`);

      const draftObj=draftStr?JSON.parse(draftStr):null;
      const savedObj=savedStr?JSON.parse(savedStr):null;
      // T4/T6: en semana actual, Draft y Snapshot se FUSIONAN.
      // El Draft conserva cambios más recientes; el Snapshot completa cualquier campo/sesión
      // que el Draft parcial no tenga. Así una fuente incompleta nunca vuelve invisible
      // ejecución ya guardada. En pasado, el Snapshot confirmado sigue teniendo prioridad.
      const d=(wkNum<realNum)?(savedObj||draftObj):mergeMissingTree(draftObj||{},savedObj||{});

      .then(r=>r.json())

  function load(id){
    dataLoaded.current=false;

    var draft=null;var saved2=null;
    try{
      var draftStr=localStorage.getItem('ase_'+user+'_draft_'+id);
      var savedStr=localStorage.getItem(SK(id,user));
      draft=draftStr?JSON.parse(draftStr):null;
      saved2=savedStr?JSON.parse(savedStr):null;
    }catch(e){}
    var targetNum=parseInt(String(id).replace('sem_',''))||1;
    // Pasado confirmado: preferir snapshot guardado sobre un draft legacy potencialmente viejo.
    // Actual: fusionar Draft + Snapshot; el Draft manda donde tiene dato y el Snapshot
    // completa huecos para que nunca desaparezca ejecución previamente guardada.
    var d=(targetNum<getRealWkNum(user))?(saved2||draft):mergeMissingTree(draft||{},saved2||{});
    if(d){
      // Hay datos locales. En semana actual igualmente reconciliamos contra Sheet:
      // una copia local parcial no puede bloquear una copia remota más completa.
      const applyWeekData=function(x){
        setNut(x.n?migrateNut(x.n):iN());
        setHab(x.h?migrateHab(x.h):iH());
        setHiitData(x.hiit||iHiit());
        setSessionReps(x.sr||{});
        setPersistedExecKg(x.skUsed||x.sk||{});
        if(targetNum!==getRealWkNum(user))setSessionKg(x.skUsed||x.sk||{});
        else {try{setSessionKg(JSON.parse(localStorage.getItem(`ase_${user}_sessKg`)||'{}')||{});}catch(_e){setSessionKg({});}}
      };
      applyWeekData(d);
      setSaved(localStorage.getItem('ase_'+user+'_reporteSent_'+id)?true:false);
      if(targetNum===getRealWkNum(user)){
        fetch(SCRIPT_URL+'?action=drafts').then(r=>r.json()).then(rows=>{
          const row=(rows||[]).find(r=>String(r.Asesorado||'').trim().toLowerCase()===user.trim().toLowerCase()&&String(r.SemanID||'').trim()===id);
          if(row&&row.Draft){

              applyWeekData(merged);

          }
        }).catch(()=>{}).finally(()=>{loadH();setTimeout(function(){dataLoaded.current=true;draftReady.current=true;cambiandoSemana.current=false;},250);});
      }else{
        loadH();
        setTimeout(function(){dataLoaded.current=true;draftReady.current=true;cambiandoSemana.current=false;},250);
      }
    }else{
      // Sin datos locales — buscar en sheet Drafts antes de resetear
      fetch(SCRIPT_URL+'?action=drafts')
        .then(function(r){return r.json();})
        .then(function(rows){
          var row=(rows||[]).find(function(r){
            return String(r.Asesorado||'').trim().toLowerCase()===user.trim().toLowerCase()&&
                   String(r.SemanID||'').trim()===id;
          });
          if(row&&row.Draft){
            try{
              var d2=JSON.parse(row.Draft);
              setNut(d2.n?migrateNut(d2.n):iN());
              setHab(d2.h?migrateHab(d2.h):iH());
              setHiitData(d2.hiit||iHiit());
              setSessionReps(d2.sr||{});
              setPersistedExecKg(d2.skUsed||d2.sk||{});
              var targetNum2=parseInt(String(id).replace('sem_',''))||1;
              if(targetNum2!==getRealWkNum(user))setSessionKg(d2.skUsed||d2.sk||{});
              // Guardar el draft remoto y, si contiene ejecución histórica, crear snapshot local.
              // Esto permite mirar desde otro dispositivo sin reconstruir sessKg de la semana actual.
              localStorage.setItem('ase_'+user+'_draft_'+id,row.Draft);
              if(d2.sk||d2.skUsed||d2.sr){
                var snapRemote={wi:id,wl:(getWkForNum(user,parseInt(String(id).replace('sem_',''))||1)||{}).label||id,n:d2.n||iN(),h:d2.h||iH(),sr:d2.sr||{},sk:d2.sk||{},skUsed:d2.skUsed||d2.sk||{},e:d2.e||[],rutina:d2.rutina||null,exec:d2.exec||{},hiit:d2.hiit||iHiit()};
                localStorage.setItem(SK(id,user),JSON.stringify(snapRemote));

                if(!hl.includes(id)){hl.push(id);localStorage.setItem(HK(user),JSON.stringify(hl));}
              }

              setNut(iN());setHab(iH());setSessionReps({});setSessionKg({});setPersistedExecKg({});setHiitData(iHiit());setSaved(false);
            }

            setNut(iN());setHab(iH());setSessionReps({});setSessionKg({});setPersistedExecKg({});setHiitData(iHiit());setSaved(false);

  function mergeMissingTree(localObj,remoteObj){
    const out=JSON.parse(JSON.stringify(localObj||{}));
    Object.keys(remoteObj||{}).forEach(function(k){
      const rv=remoteObj[k],lv=out[k];
      if(rv&&typeof rv==='object'&&!Array.isArray(rv))out[k]=mergeMissingTree((lv&&typeof lv==='object'&&!Array.isArray(lv))?lv:{},rv);
      else if(lv===undefined||lv===null||lv==='')out[k]=rv;
    });
    return out;
  }
  function syncRemoteHistoricalDrafts(){
    if(!user)return Promise.resolve();
    const realNum=getRealWkNum(user);
    return fetch(SCRIPT_URL+'?action=drafts').then(r=>r.json()).then(rows=>{
      let changed=false;
      (rows||[]).forEach(function(row){
        if(String(row.Asesorado||'').trim().toLowerCase()!==user.trim().toLowerCase())return;
        const id=String(row.SemanID||'').trim();
        if(!/^sem_\d+$/.test(id))return;
        const n=parseInt(id.replace('sem_',''))||0;
        // Sólo importar como HISTÓRICO semanas ya ocurridas. Nunca tocar la semana actual/futura ni sessKg.
        if(n<=0||n>=realNum||!row.Draft)return;
        let d;try{d=JSON.parse(row.Draft);}catch(e){return;}
        // Blindaje: sólo snapshots del formato actual, con identidad metodológica de la semana.
        if(!d||!d.rutina||!d.rutina.bloque)return;
        const hasExec=Object.keys(d.sr||{}).length||Object.keys(d.skUsed||{}).length;
        if(!hasExec)return;
        let local={};try{local=JSON.parse(localStorage.getItem(SK(id,user))||'{}')||{};}catch(e){}
        const remote={wi:id,wl:d.wl||(getWkForNum(user,n)||{}).label||id,n:d.n||iN(),h:d.h||iH(),sr:d.sr||{},sk:d.sk||{},skUsed:d.skUsed||{},e:d.e||[],rutina:d.rutina||null,exec:d.exec||{},hiit:d.hiit||iHiit()};
        // Completar huecos locales con el Draft remoto. Nunca sobreescribir un dato local existente.
        const merged=mergeMissingTree(local,remote);
        localStorage.setItem(SK(id,user),JSON.stringify(merged));
        let hl=[];try{hl=JSON.parse(localStorage.getItem(HK(user))||'[]');}catch(e){}
        if(!hl.includes(id)){hl.push(id);localStorage.setItem(HK(user),JSON.stringify(hl));}
        changed=true;
      });
      if(changed)loadH();
    }).catch(()=>{});
  }
  function loadH(){
    try{const list=JSON.parse(localStorage.getItem(HK(user))||'[]');const w=list.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,user)));}catch(e){return null;}}).filter(Boolean).sort((a,b)=>(parseInt(String(a.wi||'').replace('sem_',''))||0)-(parseInt(String(b.wi||'').replace('sem_',''))||0));setHist(w);}catch(e){setHist([]);}
  }

  const [saveErrors,setSaveErrors]=useState([]);
  function validateSave(){
    const errors=[];
    // VALIDACIONES DURAS: solo datos que realmente deben estar respondidos para reportar.
    // Entrenamiento se controla aparte como advertencia confirmable: no entrenar también es un dato válido.
    const meds=hab.meds||[];
    const hasPeso=meds.some(m=>parseFloat(m.p)>0);
    const hasCintura=meds.some(m=>parseFloat(m.c)>0);
    const sens=hab.sens||{};
    const hasSens=['energia','hambre','digestion','estres'].every(k=>sens[k]);
    if(!hasPeso&&!hab.noMediPeso)errors.push('Peso corporal: cargá una medición o marcá "No me medí"');
    if(!hasCintura&&!hab.noMediCintura)errors.push('Cintura: cargá una medición o marcá "No me medí"');
    if(!hasSens)errors.push('Sensaciones: completá Energía, Hambre, Digestión y Estrés');
    if(!Number.isInteger(hab.aguaDias7))errors.push('Agua: indicá cuántos días alcanzaste tu pauta');
    if(!Number.isInteger(hab.sleepDias7))errors.push('Sueño: indicá cuántos días dormiste mínimo 7 hs');
    if(!Number.isInteger(hab.neatDias7))errors.push('NEAT: indicá cuántos días hubo actividad física fuera del gym');
    if(!Number.isInteger(hab.toxicosDias7))errors.push('Tóxicos: indicá cuántos días hubo exposición');
    if(!hab.entrenoEstado)errors.push('Entreno: indicá si la semana fue normal o tuvo modificaciones');
    if(hab.entrenoEstado&&hab.entrenoEstado!=='normal'&&!String(hab.entrenoNota||'').trim())errors.push('Entreno: contanos brevemente qué pasó');
    if(!sens.contextoVida)errors.push('Contexto: indicá cómo fue la semana');
    if(sens.contextoVida&&sens.contextoVida!=='normal'&&!String(sens.contextoNota||'').trim())errors.push('Contexto: contanos brevemente qué cambió');
    if(!sens.dolor)errors.push('Dolor: indicá Sí o No');
    if(sens.dolor==='si'&&!sens.dolorZona)errors.push('Dolor: indicá la zona');
    if(sens.dolor==='si'&&(sens.dolorIntensidad===''||parseFloat(sens.dolorIntensidad)<0||parseFloat(sens.dolorIntensidad)>10))errors.push('Dolor: indicá intensidad entre 0 y 10');
    const nsem=hab.nutriSem||{};
    if(!Number.isInteger(nsem.dias))errors.push('Nutrición: indicá cuántos días tus comidas fueron similares a la pauta');
    if(Number.isInteger(nsem.dias)&&nsem.dias<5&&!nsem.causa)errors.push('Nutrición: indicá la causa principal');
    return errors;
  }

  function trainingWarning(){
    const bloqueActual=String(cfg?.bloque||'volumen').toLowerCase();
    const sesionesReq=['A','B','C','D','E'].slice(0,parseInt(cfg?.num)||0).filter(s=>(cfg.assign?.[s]||[]).flat(Infinity).length>0);
    const faltan=[];

    // BASE: no se esperan reps. La evidencia de entrenamiento son las respuestas del protocolo.
    if(bloqueActual==='base'){
      sesionesReq.forEach(s=>{
        let bp={};
        try{bp=JSON.parse(localStorage.getItem(`ase_${user}_baseProto_${wk.id}_${s}`)||'{}');}catch(e){}
        const ids=(cfg.assign?.[s]||[]).flat(Infinity).map(String);
        const respondio=ids.some(id=>bp[id]==='si'||bp[id]==='no'||bp[parseInt(id)]==='si'||bp[parseInt(id)]==='no');
        if(!respondio)faltan.push(s);
      });
      if(!faltan.length)return '';
      return 'Faltan respuestas de entrenamiento en '+(faltan.length===1?'la sesión ':'las sesiones ')+faltan.join(', ')+'.\n\nEn bloque Base NO tenés que cargar repeticiones: el registro es “Cumplí / No cumplí”.\n\nSi no entrenaste '+(faltan.length===1?'esa sesión':'esas sesiones')+', está bien dejarlo vacío. Si entrenaste y te olvidaste de registrarlo, elegí Cancelar y completalo antes de enviar.\n\n¿Confirmás que está bien enviar el reporte con esos datos de entrenamiento vacíos?';
    }

    // OTROS BLOQUES: revisar la semana mostrada, no solamente el estado de la sesión actual.
    let snap={};
    try{snap=JSON.parse(localStorage.getItem(SK(wk.id,user))||'{}')||{};}catch(e){}
    const srSnap=snap.sr||{};
    const skSnap=snap.skUsed||snap.sk||{};
    sesionesReq.forEach(s=>{
      const ids=(cfg.assign?.[s]||[]).flat(Infinity).map(String);
      // Fuerza: el primer ejercicio es principal/protocolo; para esta advertencia buscamos accesorios registrables.
      const idsRegistrables=(bloqueActual==='fuerza'&&ids.length>1)?ids.slice(1):ids;
      const candidatos=idsRegistrables.length?idsRegistrables:ids;
      const hay=candidatos.some(id=>{
        const repsObj=(sessionReps?.[s]?.[id]||sessionReps?.[s]?.[parseInt(id)]||srSnap?.[s]?.[id]||srSnap?.[s]?.[parseInt(id)]||{});
        const reps=Object.values(repsObj||{}).some(v=>parseInt(v)>0);
        const kgActual=sessionKg?.[s]?.[id]||sessionKg?.[s]?.[parseInt(id)]||0;
        const kgHist=skSnap?.[s]?.[id]||skSnap?.[s]?.[parseInt(id)]||0;
        return reps&&(parseFloat(kgActual)>0||parseFloat(kgHist)>0);
      });
      if(!hay)faltan.push(s);
    });
    if(!faltan.length)return '';

  async function save(){
    if(isViewingPast&&!window.confirm('Estás por modificar y enviar un reporte de una semana que ya pasó. ¿Continuar?'))return;
    if(isViewingFuture){setSaveErrors(['Las semanas futuras son solo de visualización. No se puede registrar ni enviar ejecución antes de que ocurran.']);return;}
    // Toda semana que se reporte debe pasar las validaciones duras.
    const errs=validateSave();
    if(errs.length>0){setSaveErrors(errs);return;}
    setSaveErrors([]);
    // REGLA FINAL DE REPORTE: solo Mi Semana valida si el reporte puede enviarse.
    // Entreno, Dieta, Inicio, Devolución, videos, e1RM, kg/reps y Guardar progreso
    // nunca bloquean ni exigen confirmación para reportar. Sus vacíos viajan como información real.
    // Verificar si ya se mandó reporte esta sem
    const sentKey=`ase_${user}_reporteSent_${wk.id}`;
    if(localStorage.getItem(sentKey)){
      if(!confirm('Ya enviaste el reporte de esta semana.\n\n¿Querés sobreescribirlo con los datos actuales?\n\nEn el sheet quedará solo un reporte por semana.'))return;
    }
    const dispatched=await doSave(true);
    if(!dispatched){
      localStorage.removeItem(sentKey);
      setSaved(false);
      setSaveErrors(['No se pudo completar el envío del reporte. Tu progreso quedó guardado en Drafts. Intentá nuevamente.']);
      return;
    }
    const confirmed=await confirmReportSaved();
    if(!confirmed){
      localStorage.removeItem(sentKey);
      setSaved(false);
      setSaveErrors(['El reporte no quedó confirmado en Reportes. No se marcará como enviado. Intentá nuevamente.']);
      return;
    }
    localStorage.setItem(sentKey,'1');
    setSaved(true);
  }

  function applyBaseProgressionToWeek(targetNum){
    // ÚNICA transición automática de Base: al entrar por primera vez en la semana REAL nueva.
    // No copia respuestas ni reps; sólo define la carga de la nueva exposición desde la semana anterior.
    // El marcador vuelve esta operación idempotente: navegar atrás/adelante no re-progresa.
    targetNum=parseInt(targetNum)||1;
    if(targetNum!==getRealWkNum(user)||targetNum<=1)return;
    const marker=`ase_${user}_baseProgressApplied_sem_${targetNum}`;
    if(localStorage.getItem(marker))return;
    let cfgNow=null;try{cfgNow=JSON.parse(localStorage.getItem(CFG_KEY(user))||'null');}catch(e){}
    if(!cfgNow||String(cfgNow.bloque||'').toLowerCase()!=='base')return;
    const targetId=`sem_${targetNum}`;
    // Si la semana destino ya tiene ejecución propia, no tocar su carga.
    if(localStorage.getItem(SK(targetId,user))||localStorage.getItem(`ase_${user}_draft_${targetId}`)){localStorage.setItem(marker,'1');return;}
    let prev=null;try{prev=JSON.parse(localStorage.getItem(SK(`sem_${targetNum-1}`,user))||'null');}catch(e){}
    if(!prev)return;
    let nextKg={};try{nextKg=JSON.parse(localStorage.getItem(`ase_${user}_sessKg`)||'{}')||{};}catch(e){nextKg={};}
    let changed=false;
    ['A','B','C','D','E'].slice(0,parseInt(cfgNow.num)||0).forEach(function(sess){
      let bp={};try{bp=JSON.parse(localStorage.getItem(`ase_${user}_baseProto_sem_${targetNum-1}_${sess}`)||'{}');}catch(e){}
      const ids=(cfgNow.assign?.[sess]||[]).flat(Infinity);
      ids.forEach(function(rawId){
        const id=String(rawId);
        const estado=bp[id]||bp[parseInt(id)]||'';
        if(estado!=='si'&&estado!=='no')return;
        const prevMap=(prev.skUsed&&prev.skUsed[sess])||(prev.sk&&prev.sk[sess])||{};
        const kg=parseFloat(prevMap[id]||prevMap[parseInt(id)]||0);
        if(!(kg>0))return;
        if(!nextKg[sess])nextKg[sess]={};
        nextKg[sess][parseInt(id)]=estado==='si'?rKg(kg*1.05):kg;
        changed=true;
      });
    });
    if(changed){localStorage.setItem(`ase_${user}_sessKg`,JSON.stringify(nextKg));setSessionKg(nextKg);}
    localStorage.setItem(marker,'1');
  }

    ['A','B','C','D','E'].slice(0,parseInt(cfgNow.num)||0).forEach(function(sess){
