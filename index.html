// ── SEMANAS ──────────────────────────────────────────────────────────
function getWkForNum(user,num){
  const startId=localStorage.getItem(`bas_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label,mon:wkMon,sun:wkSun};
}
function getRealWkNum(user){
  const startId=localStorage.getItem(`bas_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const today=new Date();today.setHours(12,0,0,0);
  const diffMs=today-startMon;
  if(diffMs<0)return 1;
  return Math.floor(diffMs/(7*24*60*60*1000))+1;
}
function getWkSat(user,num){
  const wk=getWkForNum(user,num);
  const sat=new Date(wk.mon);sat.setDate(wk.mon.getDate()+5);sat.setHours(23,59,59,999);
  return sat;
}

// ── SESIÓN 5 DÍAS ────────────────────────────────────────────────────
// Patrón continuo ABCABCABC... 5 días por semana
// Sem1: ABCAB, Sem2: CABCA, Sem3: BCABC...
function getSession5(wkNum,dayOfWeek){
  // dayOfWeek: 1=Lun...5=Vie
  const dayIdx=dayOfWeek-1;
  const pos=(wkNum-1)*5+dayIdx;
  return ['A','B','C'][pos%3];
}
function getTodaySession5(wkNum){
  const today=new Date();
  const dow=today.getDay(); // 0=Dom,1=Lun...6=Sab
  if(dow===0||dow===6)return null; // fin de semana
  return getSession5(wkNum,dow);
}

// ── CHART ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=120,labels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:10,b:24,l:32,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-5,textAnchor:'middle',fontSize:'9',fill:'#aaa'},l):null),
    h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mn.toFixed(1)),
    h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#bbb'},mx.toFixed(1))
  );
}

const TECNICAS_INTENSIDAD=[
  {id:'rp',n:'Rest-pause',d:'Llegá al fallo técnico, descansá 10–15 segundos y hacé algunas reps más con el mismo peso.'},
  {id:'ds',n:'Drop set',d:'Llegá al fallo técnico, bajá el peso aproximadamente 20–30% y continuá sin descanso.'},
  {id:'pa',n:'Parciales',d:'Después del fallo técnico, continuá con reps parciales en el tramo donde todavía podés mover la carga con control.'},
  {id:'as',n:'Asistidas',d:'Después del fallo técnico, una ayuda mínima te permite completar 2–3 reps más sin perder el control.'},

const LEGACY_SPLIT_FALLBACK={'3FB':['3H','3M'],'4TP':['4H','4M'],'4AA':['4H','4M'],'5TORSO':['5H'],'5INFERIOR':['5M']};
function isoToday(){return new Date().toISOString().split('T')[0];}
function parseBasicDate(v){
  const s=String(v||'').trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12,0,0,0);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1],12,0,0,0);
  const d=new Date(s);if(isNaN(d.getTime()))return null;d.setHours(12,0,0,0);return d;
}
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x;}
function getBlockWeekNum(cfg){
  if(!cfg||!cfg.startDate)return 1;
  const d=parseBasicDate(cfg.startDate);if(!d)return 1;
  const start=mondayOf(d),today=mondayOf(new Date());
  const diff=today-start;if(diff<0)return 1;
  return Math.floor(diff/(7*24*60*60*1000))+1;
}
function getBlockWk(cfg,num){
  const base=mondayOf(parseBasicDate(cfg?.startDate)||new Date());
  const mon=new Date(base);mon.setDate(base.getDate()+(num-1)*7);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=num===9?`S9 · Bloque finalizado`:`S${num}/8 · ${fmtDay(mon)}-${fmtDay(sun)} ${fmtMes(sun).charAt(0).toUpperCase()+fmtMes(sun).slice(1)}`;
  const cycle=String(cfg?.cycleId||'legacy');
  return {id:`blk_${cycle}_sem_${num}`,num,label,mon,sun};
}
function isCompatibleBlockCfg(x){
  return !!(x&&x.version===BASIC_BLOCK_VERSION&&[3,4,5].includes(parseInt(x.days))&&SPLIT_LABELS[x.split]&&BLOCK_LABELS[x.block]&&x.startDate&&x.status!=='done');
}
function readBlockCfg(user){try{const x=JSON.parse(localStorage.getItem(BLOCK_KEY(user))||'null');return isCompatibleBlockCfg(x)?x:null;}catch(e){return null;}}

function Onboarding({user,onDone}){
  const [step,setStep]=useState(1);
  const [days,setDays]=useState(null);
  const [split,setSplit]=useState(null);
  const [block,setBlock]=useState(null);
  const splits=days===3
    ?[{id:'3FB',label:'Full Body ×3',sub:'Rodilla + cadera + empuje + tracción en cada sesión; slots restantes a prioridades.'}]
    :days===4
      ?[{id:'4TP',label:'Torso / Pierna',sub:'Opción equilibrada · A/B/C/D.'},{id:'4AA',label:'Adelante / Atrás',sub:'Más libertad para enfatizar prioridades anteriores o posteriores.'}]
      :days===5
        ?[{id:'5TORSO',label:'Prioridad torso',sub:'Push · Pierna · Pull · Pierna · Torso.'},{id:'5INFERIOR',label:'Prioridad tren inferior',sub:'Anterior · Torso · Posterior · Torso · Pierna.'}]
        :[];
  const chooseDays=d=>{setDays(d);setSplit(null);setBlock(null);setStep(2);};
  const chooseSplit=s=>{setSplit(s);setBlock(null);setStep(3);};
  const finish=()=>{
    if(!days||!split||!block)return;
    const cfg={version:BASIC_BLOCK_VERSION,days,split,block,startDate:isoToday(),cycleId:String(Date.now()),status:'active'};
    try{localStorage.setItem(BLOCK_KEY(user),JSON.stringify(cfg));localStorage.setItem(`bas_${user}_split`,split);}catch(e){}
    onDone(cfg);
  };
  const btn=(active)=>({width:'100%',padding:'14px 16px',borderRadius:'12px',border:`2px solid ${active?AC:'rgba(255,255,255,0.1)'}`,background:active?AC+'22':'rgba(255,255,255,0.04)',cursor:'pointer',textAlign:'left',color:'#fff'});
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',minHeight:'100vh',background:'#0A0A0A',display:'flex',flexDirection:'column',justifyContent:'center',padding:'36px 24px'}},
    h('div',{style:{marginBottom:'24px'}},
      h('div',{style:{fontSize:'11px',fontWeight:'800',color:AC,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:'8px'}},'Nuevo bloque · '+step+'/3'),
      h('div',{style:{fontSize:'24px',fontWeight:'900',color:'#fff'}},step===1?'¿Cuántos días entrenás?':step===2?'Elegí tu estructura':'Elegí el bloque'),
      h('div',{style:{fontSize:'12px',color:'rgba(255,255,255,.45)',marginTop:'6px',lineHeight:1.5}},'Tu identidad, cargas, historial y equivalencias se conservan entre bloques.')
    ),
    step===1&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}},[3,4,5].map(d=>h('button',{key:d,onClick:()=>chooseDays(d),style:{...btn(days===d),textAlign:'center',fontSize:'18px',fontWeight:'900'}},d+' días'))),
    step===2&&h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}},splits.map(s=>h('button',{key:s.id,onClick:()=>chooseSplit(s.id),style:btn(split===s.id)},h('div',{style:{fontSize:'15px',fontWeight:'800'}},s.label),h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.5)',marginTop:'4px',lineHeight:1.45}},s.sub)))),
    step===3&&h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}},[
      {id:'volumen',label:'Volumen',sub:'P progresa 2→3→4 series. N/M mantienen dosis.'},
      {id:'intensidad',label:'Intensidad',sub:'Volumen estable. P recibe una técnica predefinida.'},
      {id:'fuerza',label:'Fuerza',sub:'Ejercicio 1 con test S1, porcentajes S2–S7 y retest S8.'}
    ].map(b=>h('button',{key:b.id,onClick:()=>setBlock(b.id),style:btn(block===b.id)},h('div',{style:{fontSize:'15px',fontWeight:'800'}},b.label),h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.5)',marginTop:'4px'}},b.sub)))),
    h('div',{style:{display:'flex',gap:'8px',marginTop:'20px'}},
      step>1&&h('button',{onClick:()=>setStep(step-1),style:{flex:1,padding:'13px',borderRadius:'10px',border:'1px solid rgba(255,255,255,.15)',background:'transparent',color:'#fff',fontWeight:'700',cursor:'pointer'}},'← Atrás'),
      step===3&&h('button',{onClick:finish,disabled:!block,style:{flex:2,padding:'13px',borderRadius:'10px',border:'none',background:block?GRAD:'rgba(255,255,255,.1)',color:'#fff',fontWeight:'900',cursor:block?'pointer':'default'}},'Empezar bloque →')
    )
  );
}

  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsRm(k){try{localStorage.removeItem(k);}catch(e){}}
  function cargar(){
    var u=nombre.trim();if(!u)return;
    setWkNum(ls(pref(u)+'wknum')||'1');

    var u=nombre.trim();if(!u)return;
    var num=parseInt(wkNum)||1;
    lsSet(pref(u)+'wknum',String(num));

    var u=nombre.trim();if(!u)return;

          h('input',{type:'password',value:pin,onChange:function(e){setPin(e.target.value);},style:Object.assign({},dark,{marginBottom:'12px'})}),
          h('button',{onClick:function(){pin===COACH_PIN?setAuth(true):setMsg('PIN incorrecto');},style:{width:'100%',background:'linear-gradient(135deg,#E8541A,#C0392B)',color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontSize:'15px',fontWeight:'700',cursor:'pointer'}},'Ingresar'),
          msg&&h('div',{style:{color:'#EF4444',marginTop:'8px',fontSize:'13px'}},msg)

      :h('div',null,
          h('div',{style:{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginBottom:'8px'}},'Nombre (exactamente como entra a la app)'),
          h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},
            h('input',{value:nombre,onChange:function(e){setNombre(e.target.value);},style:Object.assign({},dark,{flex:1})}),
            h('button',{onClick:cargar,style:{background:'#378ADD',color:'#fff',border:'none',borderRadius:'8px',padding:'10px 16px',cursor:'pointer',fontWeight:'700'}},'Cargar')

          wkNum&&h('div',null,
            h('div',{style:{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginBottom:'6px'}},'Semana actual'),
            h('input',{type:'number',value:wkNum,onChange:function(e){setWkNum(e.target.value);},style:Object.assign({},dark,{marginBottom:'10px'})}),

// ── TRAINING ─────────────────────────────────────────────────────────
function Training({user,split,blockCfg,rutinas,setRutinas,exes,wk,isViewingPast,isViewingFuture,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,setSaved}){
  const SERIES_KEYS=['r1','r2','r3','r4','r5'];
  const block=String(blockCfg?.block||'volumen');
  const blockWeek=Math.max(1,Math.min(8,parseInt(wk?.num)||1));
  const isReadOnly=!!(isViewingPast||isViewingFuture);
  const days=parseInt(blockCfg?.days)||3;
  const sesiones=['A','B','C','D','E'].slice(0,days);
  const is5day=days===5;
  const [sessOverride,setSessOverride]=useState({});
  const getNext5Sess=()=>{
    const last=localStorage.getItem(`bas_${user}_lastSess5_${split}`);
    if(!last)return 'A';const order=['A','B','C','D','E'];const idx=order.indexOf(last);return order[(idx+1)%5];
  };
  const [activeSess,setActiveSess]=useState(()=>is5day?getNext5Sess():'A');
  useEffect(()=>{if(!sesiones.includes(activeSess))setActiveSess('A');},[split,days]);

  const _norm=x=>String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
  const _findEx=nombre=>exes.find(e=>e.n===nombre)||exes.find(e=>_norm(e.n)===_norm(nombre))||{id:null,n:nombre,m:'',low:8,hi:12,url:'',intensityTech:'',forceFamily:''};
  const template=rutinas&&rutinas[split]?rutinas[split]:null;
  const raw=template?.[activeSess]||[];
  let flatPos=0;
  const sessExes=useMemo(()=>{
    flatPos=0;
    const overrides=sessOverride[activeSess]||{};

          ));

        const normalDose=()=>{

              h('div',{style:{fontSize:'13px',fontWeight:'900',color:'#9A3412'}},'Pauta: '+nSeries+' '+(nSeries===1?'serie':'series')+' × '+fixedRep+' reps'),
              h('div',{style:{fontSize:'11px',color:'#B45309',marginTop:'2px'}},'Usá el kg más alto que te permita completar la pauta con buena técnica.'),

                h('div',{style:{fontSize:'11px',fontWeight:'800',color:'#7C2D12',marginBottom:'7px'}},'Técnica de intensidad'),
                h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},TECNICAS_INTENSIDAD.map(t=>{const sel=getIntensityTech(w)===t.n;return h('button',{key:t.id,disabled:isReadOnly,onClick:()=>setIntensityTech(w,t.n),style:{padding:'6px 9px',borderRadius:'999px',border:'1px solid '+(sel?'#7C2D12':'#FED7AA'),background:sel?'#7C2D12':'#fff',color:sel?'#fff':'#9A3412',fontSize:'10px',fontWeight:'800',cursor:isReadOnly?'default':'pointer'}},t.n);})),
                (function(){const chosen=TECNICAS_INTENSIDAD.find(t=>t.n===getIntensityTech(w));return chosen?h('div',{style:{fontSize:'11px',color:'#7C2D12',lineHeight:1.45,marginTop:'7px'}},chosen.d):h('div',{style:{fontSize:'11px',color:'#B45309',marginTop:'7px'}},'Elegí una técnica para este ejercicio.');})()
              )

              :curKg>0&&h('div',null,
                  h('div',{style:{fontSize:'12px',fontWeight:'700',color:'#444',marginBottom:'7px'}},'¿Completaste '+nSeries+'×'+fixedRep+(technique&&getIntensityTech(w)?' + '+getIntensityTech(w):'')+' con buena técnica?'),
                  estado&&h('div',{style:{fontSize:'11px',color:'#777',marginBottom:'7px'}},estado==='si'?'Próxima semana: '+rKg(curKg*1.05)+' kg':'Próxima semana: mantener '+curKg+' kg'),
                  isViewingPast

                    :h('div',{style:{display:'flex',gap:'7px'}},
                        h('button',{onClick:()=>setEstado('si'),style:{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid '+(estado==='si'?G:'#ddd'),background:estado==='si'?G:'#fff',color:estado==='si'?'#fff':'#666',fontWeight:'800'}},'Cumplí'),
                        h('button',{onClick:()=>setEstado('no'),style:{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid '+(estado==='no'?R:'#ddd'),background:estado==='no'?'#FEF2F2':'#fff',color:estado==='no'?'#B91C1C':'#666',fontWeight:'800'}},'No cumplí')

      };
      return h('div',{key:'g'+gi,style:card},isBiserie&&h('div',{style:{fontSize:'10px',fontWeight:'900',color:'#999',letterSpacing:'.1em',textAlign:'center',marginBottom:'10px'}},group.length>2?'SERIE GIGANTE':'BISERIE'),group.map(renderCard));
    })
  );
}

function Dashboard({user,hist,exes,rutinas,split}){
  const [selEx,setSelEx]=useState(0);

  // Ejercicios con historial
  const exNames=useMemo(()=>{
    const names=new Set();
    hist.forEach(w=>{if(w.sr)Object.values(w.sr).forEach(s=>Object.keys(s).forEach(n=>names.add(n)));});
    return Array.from(names).sort();
  },[hist]);

  const e1rmHist=useMemo(()=>{
    const name=exNames[selEx];if(!name)return[];
    return hist.map(w=>{
      let best=0,bestKg=0;
      Object.values(w.sr||{}).forEach(s=>{
        const data=s[name];if(!data)return;
        const r1=parseInt(data.r1)||0;
        const kg=(w.skUsed?.[name])||(w.sk?.[name])||0;
        if(r1>0&&kg>0){const e1=Math.round(kg*(1+r1/30)*10)/10;if(e1>best){best=e1;bestKg=kg;}}
      });
      return best>0?{e1rm:best,kg:bestKg,label:w.wi?.slice(5)||''}:null;
    }).filter(Boolean);
  },[hist,exNames,selEx]);

  if(!hist.length)return h('div',{style:{...card,textAlign:'center',padding:'40px 20px'}},
    h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'📊'),
    h('div',{style:{fontSize:'14px',fontWeight:'600',color:'#333',marginBottom:'6px'}},'Tu progreso aparece acá'),
    h('div',{style:{fontSize:'13px',color:'#999'}},'Guardá tu primera semana para ver las estadísticas.')
  );

  return h('div',null,
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'8px'}},'e1RM — seleccioná ejercicio'),
      exNames.length===0
        ?h('div',{style:{fontSize:'13px',color:'#bbb',textAlign:'center',padding:'16px'}},'Sin datos de entrenamiento todavía')
        :h('div',null,
            h('select',{value:selEx,onChange:e=>setSelEx(parseInt(e.target.value)),style:{...inp,marginBottom:'10px',fontSize:'13px'}},
              exNames.map((n,i)=>h('option',{key:i,value:i},n))
            ),
            e1rmHist.length>=2
              ?h('div',null,
                  h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center'}},
                    h('div',{style:{flex:1,background:'#F8F8F8',borderRadius:'10px',padding:'12px',textAlign:'center'}},
                      h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'700',letterSpacing:'0.06em',marginBottom:'4px'}},'INICIO'),
                      h('div',{style:{fontSize:'20px',fontWeight:'900'}},e1rmHist[0].kg+' kg')
                    ),
                    h('div',{style:{fontSize:'22px',color:'#ccc'}},'→'),
                    h('div',{style:{flex:1,background:'#EAF7F2',border:'1px solid #A3DFC8',borderRadius:'10px',padding:'12px',textAlign:'center'}},
                      h('div',{style:{fontSize:'10px',color:G,fontWeight:'700',letterSpacing:'0.06em',marginBottom:'4px'}},'AHORA'),
                      h('div',{style:{fontSize:'20px',fontWeight:'900',color:G}},e1rmHist[e1rmHist.length-1].kg+' kg')
                    )
                  ),
                  h(LineChart,{data:e1rmHist.map(v=>v.e1rm),color:G,h:110,labels:e1rmHist.map(v=>v.label)})
                )
              :h('div',{style:{textAlign:'center',color:'#bbb',padding:'16px',fontSize:'12px'}},'Guardá al menos 2 semanas para ver la progresión')
          )
    ),
    hist.length>0&&h('div',{style:card},
      h('div',{style:lbl},'Semanas guardadas'),
      hist.slice().reverse().map((w,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:i<hist.length-1?'1px solid rgba(0,0,0,0.06)':'none',fontSize:'13px'}},
        h('span',{style:{color:'#666'}},w.wl||w.wi),
        h('span',{style:{color:'#999',fontSize:'12px'}},w.split||split)
      ))
    )
  );
}

function App(){
  const [user,setUser]=useState(()=>localStorage.getItem(USER_KEY));
  const [blockCfg,setBlockCfg]=useState(()=>{const u=localStorage.getItem(USER_KEY);return u?readBlockCfg(u):null;});
  const [split,setSplit]=useState(()=>{const u=localStorage.getItem(USER_KEY);const b=u?readBlockCfg(u):null;return b?.split||null;});
  const [rutinas,setRutinas]=useState(null);
  const [exes,setExes]=useState([]);
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState('d');
  const [wk,setWk]=useState({id:'',num:1,label:'...'});
  const [hist,setHist]=useState([]);
  const [sessionReps,setSessionReps]=useState({});
  const [sessionKg,setSessionKg]=useState({});
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const draftReady=useRef(false);
  const dataLoaded=useRef(false);
  const sessionRepsRef=useRef({});sessionRepsRef.current=sessionReps;

  const realBlockWeek=blockCfg?getBlockWeekNum(blockCfg):1;
  const blockExpired=!!blockCfg&&realBlockWeek>8;
  const currentBlockWeek=Math.min(8,Math.max(1,realBlockWeek));
  const isViewingPast=!!blockCfg&&wk.num<currentBlockWeek;
  const isViewingFuture=!!blockCfg&&wk.num>currentBlockWeek;
  const weekLocked=isViewingPast||isViewingFuture;
  const now=new Date();
  const wkFinished=wk?.sun?(now>wk.sun||now.getDay()===0):false;
  const canSaveWeek=!!blockCfg&&!blockExpired&&wk.num===currentBlockWeek&&wkFinished;
  const canGoNext=!!blockCfg&&wk.num<9;

  function loadH(u){
    try{const list=JSON.parse(localStorage.getItem(HK(u||user))||'[]');const w=list.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,u||user)));}catch(e){return null;}}).filter(Boolean);setHist(w);}catch(e){setHist([]);}
  }

  function loadWeek(num,cfg){
    const c=cfg||blockCfg;if(!c)return;
    dataLoaded.current=false;draftReady.current=false;
    const target=getBlockWk(c,num);setWk(target);
    let d=null,sv=null;
    try{
      const draft=localStorage.getItem(`bas_${user}_draft_${target.id}`);
      const savedStr=localStorage.getItem(SK(target.id,user));
      d=draft?JSON.parse(draft):(savedStr?JSON.parse(savedStr):null);
      sv=savedStr?JSON.parse(savedStr):null;
    }catch(e){}
    setSessionReps(d?.sr||{});
    setSaved(sv?true:false);
    try{
      if(num<Math.min(8,getBlockWeekNum(c)))setSessionKg(d?.skUsed||d?.sk||{});
      else setSessionKg(JSON.parse(localStorage.getItem(`bas_${user}_sessKg`)||'{}')||{});
    }catch(e){setSessionKg({});}
    setTimeout(()=>{dataLoaded.current=true;draftReady.current=true;},180);
  }

  function applyPendingLoadForCurrentWeek(cfg,n){
    if(!cfg||n<=1)return;
    const marker=`bas_${user}_nextLoadApplied_${cfg.cycleId}_${n}`;
    if(localStorage.getItem(marker))return;
    const prevKey=`bas_${user}_nextLoad_${cfg.cycleId}_${n-1}`;
    let pending={};try{pending=JSON.parse(localStorage.getItem(prevKey)||'{}')||{};}catch(e){}
    if(!Object.keys(pending).length){try{localStorage.setItem(marker,'1');}catch(e){};return;}
    let sk={};try{sk=JSON.parse(localStorage.getItem(`bas_${user}_sessKg`)||'{}')||{};}catch(e){}
    Object.values(pending).forEach(sess=>Object.values(sess||{}).forEach(item=>{
      if(!item||!item.exName)return;
      if(item.decision==='si'&&parseFloat(item.nextKg)>0)sk[item.exName]=parseFloat(item.nextKg);
      else if(item.decision==='no'&&parseFloat(item.baseKg)>0&&sk[item.exName]===undefined)sk[item.exName]=parseFloat(item.baseKg);
    }));
    try{localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(sk));localStorage.setItem(marker,'1');}catch(e){}
  }

  useEffect(()=>{
    if(!user)return;
    const cfg=readBlockCfg(user);setBlockCfg(cfg);setSplit(cfg?.split||null);
    // Mantener la fecha legacy sólo como patrimonio previo. El reloj nuevo usa block.startDate.
    if(!localStorage.getItem(`bas_${user}_startdate`))try{localStorage.setItem(`bas_${user}_startdate`,isoToday());}catch(e){}
    loadH(user);
    if(!cfg)return;
    const n=Math.min(8,getBlockWeekNum(cfg));
    applyPendingLoadForCurrentWeek(cfg,n);
    loadWeek(n,cfg);

    setLoading(true);
    Promise.all([
      fetch(SCRIPT_URL+'?action=ejercicios').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=rutinasbasicas').then(r=>r.json()).catch(()=>[])
    ]).then(([exRows,rutRows])=>{
      // ID canónico explícito. NUNCA se infiere por índice de fila.
      const parsed=(exRows||[]).map(r=>({
        id:String(r.ID??r.Id??r.id??'').trim()||null,
        n:String(r.Nombre||r.NOMBRE||r.nombre||'').trim(),
        m:String(r.Musculo||r.Músculo||r.MÚSCULO||'').trim(),
        low:parseInt(r.RepMin||r['Rep Min'])||8,
        hi:parseInt(r.RepMax||r['Rep Max'])||12,
        url:String(r.Tutorial||r.TUTORIAL||'').trim(),
        intensityTech:String(r.TecnicaIntensidad||r['Tecnica Intensidad']||r.TécnicaIntensidad||'').trim(),
        forceFamily:String(r.FamiliaFuerza||r['Familia Fuerza']||r.FuerzaPrincipal||'').trim()
      })).filter(e=>e.n);
      setExes(parsed);

      const rt={},rtMeta={};
      const parseExList=str=>{if(!str)return[];return String(str).split(',').map(s=>s.trim()).filter(Boolean).map(item=>item.includes('+')?item.split('+').map(n=>n.trim()).filter(Boolean):item);};
      (rutRows||[]).forEach(r=>{
        const sp=String(r.Split||r.Plantilla||r.Clave||'').trim();if(!sp)return;
        rt[sp]={};rtMeta[sp]={dias:parseInt(r.Dias)||parseInt(r.Sesiones)||3,descripcion:String(r.Descripcion||'').trim()};
        const numSess=parseInt(r.Sesiones)||parseInt(r.Dias)||3;
        ['A','B','C','D','E'].slice(0,numSess).forEach(ss=>rt[sp][ss]=parseExList(r['Sesion'+ss]));
      });
      // Compatibilidad transitoria: si falta la fila canónica, usar la vieja sin borrar nada.
      const fallback={};
      Object.keys(LEGACY_SPLIT_FALLBACK).forEach(k=>{
        if(rt[k])return;
        const old=(LEGACY_SPLIT_FALLBACK[k]||[]).find(x=>rt[x]);
        if(old){rt[k]=JSON.parse(JSON.stringify(rt[old]));fallback[k]=old;}
      });
      window._basTemplateFallback=fallback;

      // Overrides permanentes existentes: primero key nueva; si no existe, heredar legacy compatible.
      const sp=cfg.split;
      let override=null;
      try{override=JSON.parse(localStorage.getItem(`bas_${user}_rutOverride_${sp}`)||'null');}catch(e){}
      if(!override){for(const old of (LEGACY_SPLIT_FALLBACK[sp]||[])){try{const x=JSON.parse(localStorage.getItem(`bas_${user}_rutOverride_${old}`)||'null');if(x){override=x;break;}}catch(e){}}}
      if(override&&rt[sp])rt[sp]=override;
      setRutinas(rt);
    }).finally(()=>setLoading(false));
  },[user,blockCfg?.cycleId]);

  // Draft local: sólo después de hidratar. Nunca escribir vacío sobre patrimonio válido.
  useEffect(()=>{
    if(!user||!wk.id||!draftReady.current||!dataLoaded.current)return;
    const hasReps=Object.values(sessionReps||{}).some(s=>Object.values(s||{}).some(e=>Object.values(e||{}).some(v=>String(v??'').trim()!=='')));
    if(!hasReps)return;
    let prev={};try{prev=JSON.parse(localStorage.getItem(`bas_${user}_draft_${wk.id}`)||'{}')||{};}catch(e){}
    const next={...prev,wi:wk.id,wl:wk.label,sr:sessionReps,block:blockCfg?.block,blockWeek:wk.num,cycleId:blockCfg?.cycleId,split};
    try{localStorage.setItem(`bas_${user}_draft_${wk.id}`,JSON.stringify(next));}catch(e){}
  },[sessionReps,user,wk.id]);

  function collectForceMeta(){
    const out={};if(!blockCfg?.cycleId)return out;const pref=`bas_${user}_force_${blockCfg.cycleId}_`;
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.indexOf(pref)!==0)continue;try{out[k.slice(pref.length)]=JSON.parse(localStorage.getItem(k)||'{}');}catch(e){}}}catch(e){}
    return out;
  }

  function doSave(completeWeek){
    if(!blockCfg||blockExpired||weekLocked)return;
    setSaving(true);
    try{
      const curSR=sessionRepsRef.current||{};
      const skUsed=JSON.parse(JSON.stringify(sessionKg||{}));
      // sessKg sigue siendo la única fuente viva de cargas.
      localStorage.setItem(`bas_${user}_sessKg`,JSON.stringify(sessionKg||{}));
      let proto={};try{proto=JSON.parse(localStorage.getItem(`bas_${user}_protoConf_${wk.id}`)||'{}')||{};}catch(e){}
      const exerciseIds={};exes.forEach(e=>{if(e.id)exerciseIds[e.n]=e.id;});
      const d={wi:wk.id,wl:wk.label,sr:curSR,skUsed,sk:skUsed,split,block:blockCfg.block,blockWeek:wk.num,cycleId:blockCfg.cycleId,template:split,protoConf:proto,force:collectForceMeta(),exerciseIds};
      localStorage.setItem(SK(wk.id,user),JSON.stringify(d));
      const list=JSON.parse(localStorage.getItem(HK(user))||'[]');if(!list.includes(wk.id)){list.push(wk.id);localStorage.setItem(HK(user),JSON.stringify(list));}
      setSaved(completeWeek?true:'progreso');loadH();
    }catch(e){console.error(e);alert('No se pudo guardar el progreso. No se borró información anterior.');}
    setSaving(false);
  }
  function save(){
    if(!canSaveWeek){const fmt=wk?.sun?wk.sun.toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'fin de semana';alert('Guardar semana estará disponible al finalizar esta semana ('+fmt+').');return;}
    doSave(true);
  }
  function saveProgress(){if(weekLocked)return;doSave(false);}
  function prevWeek(){if(!blockCfg||wk.num<=1)return;loadWeek(wk.num-1,blockCfg);}
  function goToCurrent(){if(!blockCfg)return;loadWeek(currentBlockWeek,blockCfg);}
  function nextViewedWeek(){if(!blockCfg||wk.num>=9)return;loadWeek(wk.num+1,blockCfg);}

  function logout(){if(confirm('¿Cambiar nombre? La próxima vez que entres vas a elegir nuevamente días, estructura y bloque. Tus cargas, historial y equivalencias se conservan.')){try{localStorage.removeItem(USER_KEY);localStorage.removeItem(BLOCK_KEY(user));localStorage.removeItem(`bas_${user}_split`);}catch(e){}setUser(null);setBlockCfg(null);setSplit(null);}}
  const login=name=>{localStorage.setItem(USER_KEY,name);if(!localStorage.getItem(`bas_${name}_startdate`))localStorage.setItem(`bas_${name}_startdate`,isoToday());setUser(name);setBlockCfg(readBlockCfg(name));};
  const startBlock=cfg=>{setBlockCfg(cfg);setSplit(cfg.split);setTab('t');};
  const chooseNextBlock=()=>{
    if(!user)return;
    try{localStorage.removeItem(BLOCK_KEY(user));localStorage.removeItem(`bas_${user}_split`);}catch(e){}
    setBlockCfg(null);setSplit(null);setSessionReps({});setSaved(false);setTab('d');
  };

  const TABS=[{id:'d',l:'Cómo funciona',ic:'ℹ️'},{id:'t',l:'Entreno',ic:'🏋️'}];
  const showAjustar=new URLSearchParams(window.location.search).get('ajustar')==='true';
  if(showAjustar)return h(AjustarBasica,{onClose:()=>window.location.href=window.location.pathname});
  if(!user)return h(Login,{onLogin:login});
  if(!blockCfg)return h(Onboarding,{user,onDone:startBlock});
  if(blockExpired)return h(BlockFinished,{user,blockCfg,onNext:chooseNextBlock});

  const fallback=window._basTemplateFallback&&window._basTemplateFallback[split];
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F0EFED',minHeight:'100vh'}},
    h('div',{style:{background:'#0A0A0A',padding:'14px 18px',position:'sticky',top:0,zIndex:10,display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',null,
        h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,.4)',fontWeight:'800',letterSpacing:'.08em',textTransform:'uppercase'}},'Fuerza T · '+SPLIT_LABELS[split]),
        h('div',{style:{fontSize:'18px',fontWeight:'900',color:'#fff'}},user,h('button',{onClick:logout,style:{background:'none',border:'none',color:'rgba(255,255,255,.3)',fontSize:'10px',marginLeft:'8px',cursor:'pointer'}},'cambiar')),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.45)',marginTop:'2px'}},BLOCK_LABELS[blockCfg.block]+' · '+wk.label)
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px',alignItems:'flex-end',minWidth:'145px'}},
        h('button',{onClick:save,disabled:saving||saved===true||!canSaveWeek,style:{width:'100%',borderRadius:'9px',padding:'9px 10px',fontSize:'11px',fontWeight:'800',border:'none',background:saved===true?'#EAF7F2':canSaveWeek?GRAD:'rgba(255,255,255,.14)',color:saved===true?G:'#fff'}},saving?'...':saved===true?'✓ Sem guardada':'Guardar semana'),
        h('button',{onClick:saveProgress,disabled:saving||weekLocked,style:{width:'100%',borderRadius:'8px',padding:'7px 10px',fontSize:'11px',fontWeight:'700',border:'1px solid rgba(255,255,255,.15)',background:saved==='progreso'?'rgba(55,138,221,.15)':'rgba(255,255,255,.08)',color:saved==='progreso'?B:'rgba(255,255,255,.65)'}},saved==='progreso'?'✓ Progreso guardado':weekLocked?'🔒 Solo lectura':'Guardar progreso'),
        h('div',{style:{display:'flex',gap:'4px',width:'100%'}},
          h('button',{onClick:prevWeek,disabled:wk.num<=1,style:{flex:1,padding:'6px 4px',fontSize:'10px',borderRadius:'7px',border:'1px solid rgba(255,255,255,.12)',background:'rgba(255,255,255,.06)',color:wk.num<=1?'rgba(255,255,255,.2)':'rgba(255,255,255,.65)'}},'←'),
          (isViewingPast||isViewingFuture)
            ?h('button',{onClick:goToCurrent,style:{flex:2,padding:'6px',fontSize:'10px',borderRadius:'7px',border:`1px solid ${AC}`,background:AC+'22',color:AC,fontWeight:'800'}},'Sem actual')
            :h('button',{disabled:true,style:{flex:2,padding:'6px',fontSize:'10px',borderRadius:'7px',border:'1px solid rgba(255,255,255,.08)',background:'transparent',color:'rgba(255,255,255,.4)',fontWeight:'800'}},'S'+wk.num+'/8 · actual'),
          h('button',{onClick:nextViewedWeek,disabled:wk.num>=9,style:{flex:1,padding:'6px 4px',fontSize:'10px',borderRadius:'7px',border:'1px solid rgba(255,255,255,.12)',background:'rgba(255,255,255,.06)',color:wk.num>=9?'rgba(255,255,255,.2)':'rgba(255,255,255,.65)'}},'→')
        )
      )
    ),
    h('div',{style:{padding:'14px',paddingBottom:'80px'}},
      loading&&h('div',{style:{...card,textAlign:'center',padding:'28px'}},'⏳ Cargando rutinas...'),
      isViewingPast&&h('div',{style:{background:'#111',borderRadius:'10px',padding:'10px 12px',color:'#fff',fontSize:'11px',fontWeight:'700',marginBottom:'10px'}},'🔒 Semana pasada · solo lectura'),
      isViewingFuture&&h('div',{style:{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:'10px',padding:'10px 12px',color:'#1D4ED8',fontSize:'11px',fontWeight:'700',marginBottom:'10px'}},'👁 Semana futura · plan visible en solo lectura. El calendario habilita el registro cuando llegue.'),
      !loading&&wk.num===9&&h(BlockFinishedPreview,{blockCfg,onCurrent:goToCurrent}),
      !loading&&wk.num!==9&&tab==='d'&&h(HowWorks,{blockCfg,split,wk}),
      !loading&&wk.num!==9&&tab==='t'&&h(Training,{user,split,blockCfg,rutinas,setRutinas,exes,wk,isViewingPast,isViewingFuture,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,setSaved})
    ),
    h('div',{style:{background:'#0A0A0A',borderTop:'1px solid rgba(255,255,255,.06)',display:'flex',position:'sticky',bottom:0,zIndex:10}},TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:tab===t.id?`2px solid ${AC}`:'2px solid transparent',color:tab===t.id?AC:'rgba(255,255,255,.35)',fontWeight:tab===t.id?'800':'400'}},h('span',{style:{fontSize:'18px',display:'block'}},t.ic),t.l)))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
